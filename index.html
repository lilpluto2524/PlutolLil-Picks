/* --- Vegas-Anchored O/U + Bet Lines --- */
function betLines(pred,hD,aD,hId,aId,hSP,aSP,vegasData){
var vegasTotal=(vegasData&&vegasData.total)?vegasData.total:8.5;
var adj=0;
var avgSpEra=((hSP?hSP.era:4.5)+(aSP?aSP.era:4.5))/2;
adj+=(avgSpEra-4.0)/3*0.8;
var avgFip=((hSP?hSP.fip:4.2)+(aSP?aSP.fip:4.2))/2;
adj+=(avgFip-4.0)/3*0.5;
var avgOps=((hD.hit?hD.hit.ops:0.720)+(aD.hit?aD.hit.ops:0.720))/2;
adj+=(avgOps-0.720)/0.05*0.3;
var avgBpEra=((hD.bp?hD.bp.era:4.0)+(aD.bp?aD.bp.era:4.0))/2;
adj+=(avgBpEra-3.8)/2*0.4;
var pf=(T[hId]?T[hId].pf:100);
adj+=(pf-100)/10*0.3;
if(vegasData&&vegasData.wx&&!DOME[hId]){
var temp=vegasData.wx?vegasData.wx.temperature:72;
adj+=(temp-72)/30*0.2;
}
var avgK9=((hSP?hSP.k9:8.5)+(aSP?aSP.k9:8.5))/2;
adj+=(8.5-avgK9)/3*0.3;
var avgBb9=((hSP?hSP.bb9:3.0)+(aSP?aSP.bb9:3.0))/2;
adj+=(avgBb9-3.0)/2*0.2;
var modelTotal=vegasTotal+adj;
var blended=(modelTotal*0.35)+(vegasTotal*0.65);
var ouPk;
var ouDiff=blended-vegasTotal;
if(Math.abs(ouDiff)<0.3){ouPk=blended>=vegasTotal?'Over':'Under';}
else{ouPk=blended>vegasTotal?'Over':'Under';}
var totalRuns=blended;
var hShare=pred.hp/(pred.hp+pred.ap);
var rawH=totalRuns*hShare;
var rawA=totalRuns*(1-hShare);
var hSpEra=hSP?hSP.era:4.5;
var aSpEra=aSP?aSP.era:4.5;
if(aSpEra<3.0)rawH=rawH*0.8;
else if(aSpEra<3.5)rawH=rawH*0.9;
if(hSpEra<3.0)rawA=rawA*0.8;
else if(hSpEra<3.5)rawA=rawA*0.9;
if(aSpEra>5.0)rawH=rawH*1.1;
if(hSpEra>5.0)rawA=rawA*1.1;
var confGap=Math.abs(pred.hp-pred.ap);
var hWp=hD.w/(hD.w+hD.l+0.001);
var aWp=aD.w/(aD.w+aD.l+0.001);
var wpGap=Math.abs(hWp-aWp);
var eraGap=Math.abs(hSpEra-aSpEra);
var blowoutScore=(confGap*2)+(wpGap*3)+(eraGap>2?1.5:eraGap>1?0.5:0);
if(blowoutScore>2.5){
var fav=pred.hp>=pred.ap?'h':'a';
if(fav==='h'){rawH=rawH*1.4;rawA=rawA*0.7;}
else{rawA=rawA*1.4;rawH=rawH*0.7;}
}else if(blowoutScore>1.8){
var fav2=pred.hp>=pred.ap?'h':'a';
if(fav2==='h'){rawH=rawH*1.2;rawA=rawA*0.85;}
else{rawA=rawA*1.2;rawH=rawH*0.85;}
}
var hSc=Math.round(rawH);
var aSc=Math.round(rawA);
if(hSc<0)hSc=0;
if(aSc<0)aSc=0;
if(hSc===aSc){if(pred.hp>=pred.ap)hSc+=1;else aSc+=1;}

/* --- SPREAD derived from predicted score --- */
var margin=hSc-aSc;
var favTeam=pred.hp>=pred.ap?(T[hId]?T[hId].a:'HOME'):(T[aId]?T[aId].a:'AWAY');
var dogTeam=pred.hp<pred.ap?(T[hId]?T[hId].a:'HOME'):(T[aId]?T[aId].a:'AWAY');
var spread,spFav,spTxt;
if(Math.abs(margin)>=2){
spread=-1.5;
spFav=favTeam;
spTxt='-1.5 '+favTeam;
}else{
spread=1.5;
spFav=dogTeam;
spTxt='+1.5 '+dogTeam;
}

/* --- O/U derived from predicted score --- */
var modelTotal=hSc+aSc;
var ouPk;
if(vegasTotal!==null&&vegasTotal!==undefined){
ouPk=modelTotal>vegasTotal?'Over':(modelTotal<vegasTotal?'Under':'Under');
}else{
ouPk=modelTotal>8.5?'Over':'Under';
}

/* --- Money Lines --- */
var hML,aML;
if(pred.hp>0.5){hML=Math.round(-pred.hp/(1-pred.hp)*100);aML=Math.round((1-pred.hp)/pred.hp*100);}
else{hML=Math.round((1-pred.ap)/pred.ap*100);aML=Math.round(-pred.ap/(1-pred.ap)*100);}
return{hSc:hSc,aSc:aSc,spread:spread,spFav:spFav,spTxt:spTxt,hML:hML,aML:aML,ouLine:vegasTotal,ouPk:ouPk,modelTotal:modelTotal};
}

function updateParlaySlip(){
var slip=document.getElementById('parlay-slip');
var countEl=document.getElementById('ps-count');
var picksEl=document.getElementById('ps-picks');
var payoutEl=document.getElementById('ps-payout');
if(parlayPicks.length===0){slip.classList.remove('on');return;}

parlayPicks.forEach(function(p,idx){

h+='<button class="xb" data-rm-leg="'+idx+'" style="margin-left:4px;color:#ef5350">X</button></div>';
});
picksEl.innerHTML=h;
var combinedOdds=1;
parlayPicks.forEach(function(p){
var o=parseInt(p.odds)||(-110);
var dec=o>0?(o/100+1):(100/Math.abs(o)+1);
combinedOdds*=dec;
});
var americanOdds=combinedOdds>=2?Math.round((combinedOdds-1)*100):Math.round(-100/(combinedOdds-1));
var payout=(Bank.d.unit*combinedOdds).toFixed(2);
payoutEl.style.display='block';
payoutEl.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid rgba(137,207,240,.1)"><div><span style="font-size:10px;color:#888">Odds: </span><strong>'+(americanOdds>0?'+':'')+americanOdds+'</strong> <span style="font-size:10px;color:#888">| Payout: </span><strong style="color:#66bb6a">$'+payout+'</strong></div><button class="ps-save-btn" id="ps-save">Save Parlay</button></div>';
picksEl.querySelectorAll('[data-rm-leg]').forEach(function(btn){
btn.addEventListener('click',function(){
parlayPicks.splice(parseInt(this.getAttribute('data-rm-leg')),1);
updateParlaySlip();
});
});
picksEl.querySelectorAll('[data-leg-idx]').forEach(function(inp){
inp.addEventListener('change',function(){
parlayPicks[parseInt(this.getAttribute('data-leg-idx'))].odds=this.value;
updateParlaySlip();
});
});
document.getElementById('ps-save').addEventListener('click',function(){
PM.addParlay(parlayPicks.slice(),Bank.d.unit,americanOdds,payout,'Standard');
parlayPicks=[];
updateParlaySlip();
playSound('win');
});
}

function startLiveUpdates(){

(sched.dates||[]).forEach(function(dt){
(dt.games||[]).forEach(function(gm){
var sc=gm.status?gm.status.statusCode:'';
if(sc==='I'||sc==='IR'||sc==='MA'||sc==='MC'){
liveGames.push({
gpk:'mlb_'+gm.gamePk,
hSc:gm.teams.home.score||0,
aSc:gm.teams.away.score||0,
inn:gm.linescore?gm.linescore.currentInningOrdinal:'',
half:gm.linescore?gm.linescore.inningHalf:''
});
}
if(sc==='F'||sc==='FT'){
var gpk='mlb_'+gm.gamePk;
var hSc=gm.teams.home.score||0;
var aSc=gm.teams.away.score||0;
var inn1h=gm.linescore&&gm.linescore.innings&&gm.linescore.innings[0]?gm.linescore.innings[0].home.runs:0;
var inn1a=gm.linescore&&gm.linescore.innings&&gm.linescore.innings[0]?gm.linescore.innings[0].away.runs:0;
if(Trk.score(gpk,hSc,aSc,inn1h,inn1a)){
var entry=Trk.d.p.find(function(x){return x.g===gpk;});
if(entry){
if(entry.w)playSound('win');else playSound('loss');
sendNotif('PLP Result',entry.hT+' vs '+entry.aT+': '+(entry.w?'WIN':'LOSS'));
}
}
}
});
});
liveGames.forEach(function(lg){
var prev=prevLiveStates[lg.gpk];
if(prev&&(prev.hSc!==lg.hSc||prev.aSc!==lg.aSc)){
playSound('score');
sendNotif('Score Update',lg.hSc+'-'+lg.aSc+' ('+lg.half+' '+lg.inn+')');
}
prevLiveStates[lg.gpk]=lg;
});
document.getElementById('last-upd').textContent='Last updated: '+new Date().toLocaleTimeString();
}).catch(function(){});
}
},CFG.LIVE_INT);
}

try{
var gid=gpk.replace('mlb_','');

var home=[],away=[];
if(d.liveData&&d.liveData.boxscore){
var hB=d.liveData.boxscore.teams.home;
var aB=d.liveData.boxscore.teams.away;
if(hB.battingOrder)hB.battingOrder.forEach(function(id){

if(p)home.push({name:p.person.fullName,pos:p.position.abbreviation,avg:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.avg:'--',hr:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.homeRuns:'--',rbi:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.rbi:'--',ops:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.ops:'--'});
});
if(aB.battingOrder)aB.battingOrder.forEach(function(id){
var p=aB.players['ID'+id];
if(p)away.push({name:p.person.fullName,pos:p.position.abbreviation,avg:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.avg:'--',hr:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.homeRuns:'--',rbi:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.rbi:'--',ops:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.ops:'--'});
});
}
return{home:home,away:away};
}catch(e){return{home:[],away:[]};}
}

/* --- Pitcher Prop Predictions --- */
function renderPitcherProps(hSP,aSP,hTeam,aTeam,hD,aD){
if(!hSP&&!aSP)return'<div style="color:#888;font-size:10px;padding:4px">Pitcher prop data not available</div>';
function projK(sp,oppD){
if(!sp)return{val:5.0,conf:'Low'};
var k9=sp.k9||7.0;
var ip=sp.ip||80;
var avgIP=ip/(sp.gs||15);
var oppK=oppD&&oppD.hit?(1-(oppD.hit.avg||0.250))*1.2:1.0;
var predK=((k9/9)*avgIP)*oppK;
predK=Math.max(2,Math.min(14,predK));
var conf=sp.gs>=10?'High':(sp.gs>=5?'Med':'Low');
return{val:predK,conf:conf};
}
function projHits(sp,oppD){
if(!sp)return{val:6.0,conf:'Low'};
var whip=sp.whip||1.30;
var ip=sp.ip||80;
var avgIP=ip/(sp.gs||15);
var bb9=sp.bb9||3.0;
var hPer9=((whip*9)-bb9);
var predH=(hPer9/9)*avgIP;
var oppAvg=oppD&&oppD.hit?oppD.hit.avg||0.250:0.250;
predH=predH*(oppAvg/0.250);
predH=Math.max(2,Math.min(12,predH));
var conf=sp.gs>=10?'High':(sp.gs>=5?'Med':'Low');
return{val:predH,conf:conf};
}
function projER(sp,oppD){
if(!sp)return{val:3.0,conf:'Low'};
var era=sp.era||4.50;
var ip=sp.ip||80;
var avgIP=ip/(sp.gs||15);
var predER=(era/9)*avgIP;
var oppOps=oppD&&oppD.hit?oppD.hit.ops||0.720:0.720;
predER=predER*(oppOps/0.720);
predER=Math.max(0,Math.min(8,predER));
var conf=sp.gs>=10?'High':(sp.gs>=5?'Med':'Low');
return{val:predER,conf:conf};
}
var hK=projK(hSP,aD),aK=projK(aSP,hD);
var hH=projHits(hSP,aD),aH=projHits(aSP,hD);
var hER=projER(hSP,aD),aER=projER(aSP,hD);
function confClr(c){return c==='High'?'#66bb6a':(c==='Med'?'#ffd54f':'#ef5350');}
function propRow(label,hVal,hConf,aVal,aConf,lower){
var hBetter=lower?(hVal<=aVal):(hVal>=aVal);
var aBetter=!hBetter;
if(hVal===aVal){hBetter=false;aBetter=false;}
var hClr=hBetter?'#66bb6a':'#e0e0e0';
var aClr=aBetter?'#66bb6a':'#e0e0e0';
var r='<tr style="border-bottom:1px solid rgba(137,207,240,.04)">';
r+='<td style="padding:4px;text-align:center;font-weight:800;color:'+hClr+'">'+hVal.toFixed(1)+'</td>';
r+='<td style="text-align:center;font-size:8px;color:'+confClr(hConf)+'">'+hConf+'</td>';
r+='<td style="text-align:center;color:#89CFF0;font-weight:700;font-size:10px">'+label+'</td>';
r+='<td style="text-align:center;font-size:8px;color:'+confClr(aConf)+'">'+aConf+'</td>';
r+='<td style="padding:4px;text-align:center;font-weight:800;color:'+aClr+'">'+aVal.toFixed(1)+'</td>';
r+='</tr>';
return r;
}
var h='<div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(137,207,240,.08)">';
h+='<div style="text-align:center;font-size:10px;font-weight:800;color:#89CFF0;margin-bottom:6px">Pitcher Prop Predictions</div>';
h+='<table style="width:100%;font-size:9px;border-collapse:collapse;color:#e0e0e0">';
h+='<tr style="color:#89CFF0;font-weight:800;border-bottom:1px solid rgba(137,207,240,.1)">';
h+='<td style="text-align:center;padding:2px 4px">'+hTeam+'</td>';
h+='<td style="text-align:center;font-size:8px">Conf</td>';
h+='<td style="text-align:center">Prop</td>';
h+='<td style="text-align:center;font-size:8px">Conf</td>';
h+='<td style="text-align:center;padding:2px 4px">'+aTeam+'</td>';
h+='</tr>';
h+=propRow('PRED K',hK.val,hK.conf,aK.val,aK.conf,false);
h+=propRow('PRED HITS',hH.val,hH.conf,aH.val,aH.conf,true);
h+=propRow('PRED ER',hER.val,hER.conf,aER.val,aER.conf,true);
h+='</table>';
h+='<div style="text-align:center;font-size:8px;color:#888;margin-top:4px">Green = better projection | Conf based on games started</div>';
h+='</div>';
return h;
}

function renderBatterProps(players){

h+='<tr style="border-bottom:1px solid rgba(137,207,240,.04)"><td style="padding:2px 4px;font-weight:700">'+p.name+'</td><td>'+p.avg+'</td><td>'+p.ops+'</td><td>'+p.hr+'</td><td style="color:'+hitClr+';font-weight:700">'+hitProj+'</td><td style="color:'+hrClr+';font-weight:700">'+hrProj+'</td></tr>';
});
h+='</table>';
return h;
}
