/* --- 23-Factor MLB Prediction Model --- */
function predict(hD,aD,opts){
var f={};
var hElo=Elo.get(opts.hId||0),aElo=Elo.get(opts.aId||0);
f.elo=(hElo-aElo)/400*0.08;
f.hfa=0.024;
var pf=(opts.pf||100);
f.park=(pf-100)/100*0.02;
var hWin=hD.w||0,hLoss=hD.l||0,aWin=aD.w||0,aLoss=aD.l||0;
var hWp=hWin+hLoss>0?hWin/(hWin+hLoss):0.5;
var aWp=aWin+aLoss>0?aWin/(aWin+aLoss):0.5;
f.record=(hWp-aWp)*0.06;
var hRpg=hD.rpg||4.5,aRpg=aD.rpg||4.5;
var hRa=hD.ra||4.5,aRa=aD.ra||4.5;
f.run=(((hRpg-aRa)-(aRpg-hRa))/5)*0.05;
var hSP=opts.hSP,aSP=opts.aSP;
if(hSP&&aSP){
f.sp_era=((aSP.era-hSP.era)/4)*0.06;
f.sp_whip=((aSP.whip-hSP.whip)/0.5)*0.04;
f.sp_k9=((hSP.k9-aSP.k9)/5)*0.03;
f.sp_fip=((aSP.fip-hSP.fip)/3)*0.04;
f.sp_bb9=((aSP.bb9-hSP.bb9)/2)*0.02;
f.sp_ip=((hSP.ip-aSP.ip)/2)*0.02;
}else{f.sp_era=0;f.sp_whip=0;f.sp_k9=0;f.sp_fip=0;f.sp_bb9=0;f.sp_ip=0;}
var hBp=hD.bp||{},aBp=aD.bp||{};
var hBpEra=hBp.era||4.0,aBpEra=aBp.era||4.0;
var hBpWhip=hBp.whip||1.30,aBpWhip=aBp.whip||1.30;
var hBpK9=hBp.k9||8.5,aBpK9=aBp.k9||8.5;
f.bp_era=((aBpEra-hBpEra)/3)*0.04;
f.bp_whip=((aBpWhip-hBpWhip)/0.4)*0.02;
f.bp_k9=((hBpK9-aBpK9)/4)*0.01;
var hHit=hD.hit||{},aHit=aD.hit||{};
f.ops=((hHit.ops||0.720)-(aHit.ops||0.720))/0.1*0.04;
f.avg=((hHit.avg||0.250)-(aHit.avg||0.250))/0.05*0.02;
f.kpct=((aHit.kPct||22)-(hHit.kPct||22))/10*0.02;
var hBp=hD.bp||{},aBp=aD.bp||{};
f.bp_era=((aBp.era||4.0)-(hBp.era||4.0))/3*0.04;
f.bp_whip=((aBp.whip||1.3)-(hBp.whip||1.3))/0.3*0.02;
f.def=((aD.errors||50)-(hD.errors||50))/30*0.02;
if(opts.wx&&!DOME[opts.hId]){
var temp=opts.wx.current_weather?opts.wx.current_weather.temperature:72;
f.wx=(temp-72)/50*0.01;
}else{f.wx=0;}
f.streak=((hD.streak||0)-(aD.streak||0))/10*0.02;
f.rdiff=((hD.rdiff||0)-(aD.rdiff||0))/100*0.03;
var total=0;
Object.keys(f).forEach(function(k){total+=f[k];});
var hp=1/(1+Math.pow(10,-total));
var ap=1-hp;
var rawConf=Math.abs(hp-0.5)*2;
var conf=rawConf*0.85+0.02;
return{hp:hp,ap:ap,conf:conf,f:f};
}


/* --- YRFI/NRFI Model (Rebuilt — Decisive Majority Vote) --- */
function predictYRFI(hSP,aSP,hD,aD,hId,vegasData){
var votes=0;
var totalVotes=0;

/* --- Factor 1: Home SP ERA (strongest signal) --- */
if(hSP&&hSP.era){
totalVotes++;
if(hSP.era>=4.5)votes++;
else if(hSP.era<=3.2)votes--;
}

/* --- Factor 2: Away SP ERA --- */
if(aSP&&aSP.era){
totalVotes++;
if(aSP.era>=4.5)votes++;
else if(aSP.era<=3.2)votes--;
}

/* --- Factor 3: Home SP WHIP --- */
if(hSP&&hSP.whip){
totalVotes++;
if(hSP.whip>=1.40)votes++;
else if(hSP.whip<=1.10)votes--;
}

/* --- Factor 4: Away SP WHIP --- */
if(aSP&&aSP.whip){
totalVotes++;
if(aSP.whip>=1.40)votes++;
else if(aSP.whip<=1.10)votes--;
}

/* --- Factor 5: Home SP K/9 (high K = harder to score) --- */
if(hSP&&hSP.k9){
totalVotes++;
if(hSP.k9>=10)votes--;
else if(hSP.k9<=6)votes++;
}

/* --- Factor 6: Away SP K/9 --- */
if(aSP&&aSP.k9){
totalVotes++;
if(aSP.k9>=10)votes--;
else if(aSP.k9<=6)votes++;
}

/* --- Factor 7: Away team OPS vs Home SP --- */
var aOps=aD.hit?aD.hit.ops||0.720:0.720;
totalVotes++;
if(aOps>=0.780)votes++;
else if(aOps<=0.680)votes--;

/* --- Factor 8: Home team OPS vs Away SP --- */
var hOps=hD.hit?hD.hit.ops||0.720:0.720;
totalVotes++;
if(hOps>=0.780)votes++;
else if(hOps<=0.680)votes--;

/* --- Factor 9: Park Factor --- */
var pf=(T[hId]?T[hId].pf:100);
totalVotes++;
if(pf>=106)votes++;
else if(pf<=95)votes--;

/* --- Decide: Need 2+ votes for YRFI, otherwise NRFI (NRFI bias) --- */
var yrfiProb;
if(votes>=3)yrfiProb=0.62+((votes-3)*0.04);
else if(votes>=2)yrfiProb=0.55;
else if(votes<=(-3))yrfiProb=0.25-((Math.abs(votes)-3)*0.03);
else if(votes<=(-2))yrfiProb=0.32;
else if(votes===1)yrfiProb=0.52;
else if(votes===(-1))yrfiProb=0.40;
else yrfiProb=0.42;

yrfiProb=Math.max(0.20,Math.min(0.80,yrfiProb));
var pick=yrfiProb>=0.50?'YRFI':'NRFI';
var conf=pick==='YRFI'?yrfiProb:(1-yrfiProb);
return{pick:pick,prob:conf,conf:Math.abs(conf-0.5)*2,yrfiProb:yrfiProb,nrfiProb:1-yrfiProb};
}

/* --- Pure v7.3 O/U + Bet Lines --- */
function betLines(pred,hD,aD,hId,aId,hSP,aSP,vegasData){
var vegasTotal=(vegasData&&vegasData.total)?vegasData.total:8.5;

/* --- O/U: Pure v7.3 formula (DO NOT TOUCH — hit 77%) --- */
var hOff=hD.hit||{};var aOff=aD.hit||{};
var hR=4.3,aR=4.3;
if(aSP&&aSP.era)hR=4.3*(aSP.era/4.5);
if(hSP&&hSP.era)aR=4.3*(hSP.era/4.5);
var hOps73=hOff.ops||0.720;
var aOps73=aOff.ops||0.720;
hR=hR*(hOps73/0.720);
aR=aR*(aOps73/0.720);
var pf73val=(T[hId]?T[hId].pf:100)/100;
hR=hR*pf73val;
aR=aR*pf73val;
if(aSP&&aSP.whip&&aSP.whip>1.4)hR=hR*1.08;
if(hSP&&hSP.whip&&hSP.whip>1.4)aR=aR*1.08;
var modelTotal=hR+aR;
var ouLine=vegasTotal;
var ouPk=modelTotal>ouLine?'Over':'Under';

/* --- Predicted Score (independent from O/U — display only) --- */
var hShare=0.5+(pred.hp-pred.ap)*0.15;
var rawH=modelTotal*Math.max(0.3,Math.min(0.7,hShare));
var rawA=modelTotal*(1-Math.max(0.3,Math.min(0.7,hShare)));
var hSc=Math.round(rawH);
var aSc=Math.round(rawA);
if(hSc<0)hSc=0;
if(aSc<0)aSc=0;
if(hSc===aSc){if(pred.hp>=pred.ap)hSc+=1;else aSc+=1;}
if(pred.ap>pred.hp&&aSc<hSc){var tmp=hSc;hSc=aSc;aSc=tmp;}

/* --- SPREAD: Smart Close-Game Detection --- */
var margin=hSc-aSc;
var favTeam=pred.hp>=pred.ap?(T[hId]?T[hId].a:'HOME'):(T[aId]?T[aId].a:'AWAY');
var dogTeam=pred.hp<pred.ap?(T[hId]?T[hId].a:'HOME'):(T[aId]?T[aId].a:'AWAY');
var spread,spFav,spTxt;

var closeScore=0;
var hEraS=hSP?hSP.era:4.5;
var aEraS=aSP?aSP.era:4.5;
var hWinPct=hD.w/(hD.w+hD.l+0.001);
var aWinPct=aD.w/(aD.w+aD.l+0.001);

if(hEraS<3.50&&aEraS<3.50)closeScore+=2;
else if(hEraS<4.00&&aEraS<4.00)closeScore+=1;

if(Math.abs(hWinPct-aWinPct)<0.08)closeScore+=2;
else if(Math.abs(hWinPct-aWinPct)<0.15)closeScore+=1;

if(modelTotal&&modelTotal<7.5)closeScore+=1;

var hBpEra=hD.bp?hD.bp.era:4.5;
var aBpEra=aD.bp?aD.bp.era:4.5;
if(hBpEra<3.50&&aBpEra<3.50)closeScore+=1;

var confDiff=Math.abs(pred.hp-pred.ap);
if(confDiff<0.10)closeScore+=2;
else if(confDiff<0.20)closeScore+=1;

if(closeScore>=4){
spread=1.5;
spFav=dogTeam;
spTxt='+1.5 '+dogTeam;
}else{
spread=-1.5;
spFav=favTeam;
spTxt='-1.5 '+favTeam;
}

/* --- Force score to match spread --- */
if(spread===-1.5){
var scoreMargin=Math.abs(hSc-aSc);
if(scoreMargin<2){
if(favTeam===(T[hId]?T[hId].a:'HOME'))hSc=aSc+2;
else aSc=hSc+2;
}
}
if(spread===1.5){
var scoreMargin2=Math.abs(hSc-aSc);
if(scoreMargin2>1){
if(hSc>aSc)aSc=hSc-1;
else hSc=aSc-1;
}
}

/* --- Force score to match O/U --- */
var newTotal=hSc+aSc;
if(ouPk==='Under'&&newTotal>modelTotal){
var diff=Math.ceil(newTotal-modelTotal);
if(hSc>aSc)aSc=Math.max(0,aSc-diff);
else hSc=Math.max(0,hSc-diff);
if(hSc===aSc){if(pred.hp>=pred.ap)hSc+=1;else aSc+=1;}
}
if(ouPk==='Over'&&newTotal<=modelTotal){
var diff2=Math.ceil(modelTotal-newTotal)+1;
if(hSc>aSc)hSc+=diff2;
else aSc+=diff2;
}

/* --- Money Lines --- */
var hML,aML;
if(pred.hp>0.5){hML=Math.round(-pred.hp/(1-pred.hp)*100);aML=Math.round((1-pred.hp)/pred.hp*100);}
else{hML=Math.round((1-pred.ap)/pred.ap*100);aML=Math.round(-pred.ap/(1-pred.ap)*100);}
return{hSc:hSc,aSc:aSc,spread:spread,spFav:spFav,spTxt:spTxt,hML:hML,aML:aML,ouLine:vegasTotal,ouPk:ouPk,modelTotal:modelTotal};
}

var temp=opts.wx.current_weather?opts.wx.current_weather.temperature:65;

f.wx=((temp-65)/50*0.01)+((10-wind)/30*0.01);
}else{f.wx=0;}

var total=0;
Object.keys(f).forEach(function(k){total+=f[k];});
var hp=1/(1+Math.pow(10,-total));

/* --- NFL Bet Lines --- */
function nflBetLines(pred,hD,aD,hId,aId,vegasData){

var adj=0;
adj+=((hD.ppg||22)+(aD.ppg||22)-44)/10*0.5;

if(vegasData&&vegasData.wx&&!NFL_DOMES[hId]){
var temp=vegasData.wx?vegasData.wx.temperature:65;
adj+=(temp-65)/40*0.3;
}
var modelTotal=vegasTotal+adj;
var deviation=modelTotal-vegasTotal;
var blended;
if(Math.abs(deviation)<1.5){blended=modelTotal*0.35+vegasTotal*0.65;}
else{blended=modelTotal*0.45+vegasTotal*0.55;}
var ouPk=blended>vegasTotal?'Over':'Under';
var totalPts=Math.round(blended);
if(totalPts<14)totalPts=14;
var hOff=hD.ppg||22;var aOff=aD.ppg||22;var hDef=hD.papg||22;var aDef=aD.papg||22;var leagueAvg=22;
var hProj=(hOff*0.35)+(aDef*0.25)+(leagueAvg*0.15)+((hD.rzPct||55)/55*3*0.10)+((30-(hD.turnovers||15))/30*2*0.05)+(((hD.thirdPct||40)/100)*7*0.05)+((pred.hp>pred.ap)?1:0)*0.05;
var aProj=(aOff*0.35)+(hDef*0.25)+(leagueAvg*0.15)+((aD.rzPct||55)/55*3*0.10)+((30-(aD.turnovers||15))/30*2*0.05)+(((aD.thirdPct||40)/100)*7*0.05)+((pred.ap>pred.hp)?1:0)*0.05;
if(!NFL_DOMES[hId]&&vegasData&&vegasData.wx){var wind=vegasData.wx.windspeed||0;var temp=vegasData.wx.temperature||65;if(wind>20){hProj-=2;aProj-=2;}else if(wind>12){hProj-=1;aProj-=1;}if(temp<32){hProj-=1.5;aProj-=1.5;}else if(temp<45){hProj-=0.5;aProj-=0.5;}}
if(pred.hp>=pred.ap){hProj+=1.0;}else{aProj+=1.0;}
var restAdj=((hD.rest||7)-(aD.rest||7))/7*1.5;hProj+=restAdj/2;aProj-=restAdj/2;
hProj=Math.round(hProj);aProj=Math.round(aProj);
if(hProj===aProj){if(pred.hp>=pred.ap)hProj+=3;else aProj+=3;}
hProj=Math.max(3,hProj);aProj=Math.max(3,aProj);
var hSc=hProj;var aSc=aProj;
var modelTotal=hSc+aSc;hSc=Math.max(3,hSc);aSc=Math.max(3,aSc);
var spread=aSc-hSc;
var hA=(NFL[hId]&&NFL[hId].a)||'HOME';
var spTxt=(spread>0?'+':'')+spread.toFixed(1)+' '+hA;
var hML,aML;
if(pred.hp>0.5){hML=Math.round(-pred.hp/(1-pred.hp)*100);aML=Math.round((1-pred.hp)/pred.hp*100);}
else{hML=Math.round((1-pred.ap)/pred.ap*100);aML=Math.round(-pred.ap/(1-pred.ap)*100);}
return{hSc:hSc,aSc:aSc,spread:spread,spTxt:spTxt,hML:hML,aML:aML,ouLine:vegasTotal,ouPk:ouPk,modelTotal:parseFloat(blended.toFixed(1))};
}

async function nflGetTeamStats(teamId){
try{
var statData=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/'+teamId+'/statistics?season=2026&seasontype=2').then(function(r){return r.json();});

/* NEW: Fetch team schedule for papg, pdiff, streak, rest */
var schedData=null;
try{schedData=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/'+teamId+'/schedule?season=2026&seasontype=2').then(function(r){return r.json();});}catch(e){schedData=null;}

var stats={ppg:22,papg:22,ypg:340,yapg:340,passYapg:230,rushYapg:110,rushYpg:120,passYpg:220,turnovers:15,thirdPct:40,rzPct:55,sacks:30,penYpg:50,streak:0,pdiff:0,dvoa:0,sos:0.5,rest:7,w:0,l:0};
var gamesPlayed=4;

/* --- Parse team statistics (exact ESPN stat names) --- */
if(statData&&statData.results&&statData.results.stats){
var cats=statData.results.stats.categories||[];
cats.forEach(function(cat){
var catName=(cat.name||'').toLowerCase();
(cat.stats||[]).forEach(function(s){
var n=s.name||'';
var v=parseFloat(s.value)||0;

if(n==='teamGamesPlayed'&&v>0)gamesPlayed=v;
if(n==='totalPointsPerGame')stats.ppg=v;
if(n==='yardsPerGame'&&catName==='passing')stats.ypg=v;
if(n==='rushingYardsPerGame'&&catName==='rushing')stats.rushYpg=v;
if(n==='netPassingYardsPerGame'||n==='passingYardsPerGame'&&catName==='passing')stats.passYpg=v;
if(n==='thirdDownConvPct')stats.thirdPct=v;
if(n==='redzoneScoringPct')stats.rzPct=v;
if(n==='redzoneEfficiencyPct'&&stats.rzPct===55)stats.rzPct=v;
if(n==='totalGiveaways')stats.turnovers=v;
if(n==='turnOverDifferential')stats._toDiff=v;
if(n==='totalPenaltyYards')stats.penYpg=gamesPlayed>0?v/gamesPlayed:v;
if(n==='sacks'&&catName==='defensive')stats.sacks=v;
});
});
}

/* --- Parse schedule for papg, pdiff, streak, rest, w, l --- */
if(schedData&&schedData.events){
var totalPF=0,totalPA=0,wins=0,losses=0,streak=0,lastResult='';
var lastGameDate=null;
var completedGames=[];

schedData.events.forEach(function(ev){
var comp=ev.competitions&&ev.competitions[0];
if(!comp)return;
var home=null,away=null;
(comp.competitors||[]).forEach(function(c){
if(c.homeAway==='home')home=c;
else away=c;
});
if(!home||!away)return;

/* Figure out which is our team */
var isHome=home.team&&home.team.id==String(teamId);
var myTeam=isHome?home:away;
var oppTeam=isHome?away:home;

/* Check if game is completed (winner field exists) */
if(myTeam.winner===undefined&&oppTeam.winner===undefined)return;

var myScore=myTeam.score?myTeam.score.value||parseInt(myTeam.score.displayValue)||0:0;
var oppScore=oppTeam.score?oppTeam.score.value||parseInt(oppTeam.score.displayValue)||0:0;

if(myScore===0&&oppScore===0)return;

totalPF+=myScore;
totalPA+=oppScore;
var won=myTeam.winner===true;
if(won)wins++;else losses++;

/* Streak calc */
var thisResult=won?'W':'L';
if(lastResult===''||lastResult===thisResult){
streak+=(won?1:-1);
}else{
streak=won?1:-1;
}
lastResult=thisResult;

/* Track game date for rest calculation */
if(ev.date)lastGameDate=ev.date;

/* Track opponent records for SOS */
completedGames.push({
oppId:oppTeam.team?oppTeam.team.id:null,
oppRecord:oppTeam.record||[],
won:won
});
});

var gp=wins+losses;
if(gp>0){
gamesPlayed=gp;
stats.ppg=totalPF/gp;
stats.papg=totalPA/gp;
stats.pdiff=totalPF-totalPA;
stats.w=wins;
stats.l=losses;
stats.streak=streak;
}

/* Calculate rest days from last game */
if(lastGameDate){
var lastDate=new Date(lastGameDate);
var now=new Date();
var diffDays=Math.floor((now-lastDate)/(1000*60*60*24));
stats.rest=Math.max(1,Math.min(14,diffDays));
}

/* Calculate SOS from opponent records */
if(completedGames.length>0){
var oppWins=0,oppGames=0;
completedGames.forEach(function(cg){
if(cg.oppRecord&&cg.oppRecord.length>0){
var recStr=cg.oppRecord[0].displayValue||'0-0';
var parts=recStr.split('-');
var ow=parseInt(parts[0])||0;
var ol=parseInt(parts[1])||0;
oppWins+=ow;
oppGames+=ow+ol;
}
});
if(oppGames>0)stats.sos=oppWins/oppGames;
}

/* Calculate yapg from papg (ESPN doesn't give defensive yards in this endpoint) */
if(stats.papg!==22){
stats.yapg=340*(stats.papg/22);
stats.passYapg=230*(stats.papg/22);
stats.rushYapg=110*(stats.papg/22);
}

/* Guard rails */
stats.yapg=Math.max(200,Math.min(500,stats.yapg));
stats.passYapg=Math.max(140,Math.min(330,stats.passYapg));
stats.rushYapg=Math.max(70,Math.min(190,stats.rushYapg));
}

/* DVOA estimate from point differential per game */
if(gamesPlayed>0&&stats.pdiff!==0){
stats.dvoa=stats.pdiff/(gamesPlayed*10);
stats.dvoa=Math.max(-0.5,Math.min(0.5,stats.dvoa));
}

/* Clean up temp fields */
delete stats._toDiff;

return stats;
}catch(e){
console.warn('nflGetTeamStats error for team '+teamId+':',e);
return{ppg:22,papg:22,ypg:340,yapg:340,rushYpg:120,passYpg:220,passYapg:230,rushYapg:110,turnovers:15,thirdPct:40,rzPct:55,sacks:30,penYpg:50,streak:0,pdiff:0,dvoa:0,sos:0.5,rest:7,w:0,l:0};
}
}

/* ===== SMART PARLAY GENERATOR ===== */
async function generateSmartParlays(){
var resultsEl=document.getElementById('parlay-builder-results');
if(!resultsEl)return;
resultsEl.innerHTML='<div class="ld"><div class="spin"></div> Analyzing all matchups...</div>';

try{
var sb=await fetch('https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week='+NFL_WEEK+'&seasontype=2').then(function(r){return r.json();});
if(!sb||!sb.events)return;

var matchups=[];
(sb.events||[]).forEach(function(ev){
var comp=ev.competitions&&ev.competitions[0];
if(!comp)return;
var home=null,away=null;
(comp.competitors||[]).forEach(function(c){
var info={id:c.team.id,abbr:c.team.abbreviation,name:c.team.displayName||c.team.name};
if(c.homeAway==='home')home=info;else away=info;
});
if(home&&away)matchups.push({home:home,away:away});
});

/* Fetch all rosters + stats */
var allIds=[];
matchups.forEach(function(m){
if(allIds.indexOf(m.home.id)<0)allIds.push(m.home.id);
if(allIds.indexOf(m.away.id)<0)allIds.push(m.away.id);
});

var sMap={},rMap={},iMap={};
await Promise.all(allIds.map(async function(tid){
var r=await Promise.all([
nflGetTeamStats(tid).catch(function(){return{papg:22,yapg:340};}),
fetchNFLRoster(tid).catch(function(){return{qb:[],rb:[],wr:[],te:[],k:[],gamesPlayed:0};}),
fetchNFLInjuries(tid).catch(function(){return[];})
]);
sMap[tid]=r[0];rMap[tid]=r[1];iMap[tid]=r[2];
}));

/* Build all prop legs */
var allLegs=[];
var allTDLegs=[];

matchups.forEach(function(m){
var hS=sMap[m.home.id]||{};var aS=sMap[m.away.id]||{};
var hR=rMap[m.home.id]||{};var aR=rMap[m.away.id]||{};
var hI=iMap[m.home.id]||[];var aI=iMap[m.away.id]||[];

/* Get wx */
var wxF=0;
var gc=window._plpNFLCache||[];
gc.forEach(function(g){if(g.hI&&g.hI.a===m.home.abbr){wxF=g.pred&&g.pred.f?g.pred.f.wx||0:0;}});
hS.wxFactor=wxF;aS.wxFactor=wxF;

/* Calc totals + enrich */
function cT(roster){
var ra=0,tg=0;
['qb','rb','wr','te'].forEach(function(pos){(roster[pos]||[]).forEach(function(p){
if(p.statCats){
if(p.statCats.rushing){var rt=p.statCats.rushing.totals||[];if(rt[0])ra+=(rt[0].val||rt[0].num||0);}
if(p.statCats.receiving){var rc=p.statCats.receiving.totals||[];if(rc[5])tg+=(rc[5].val||rc[5].num||0);else if(rc[0])tg+=(rc[0].val||rc[0].num||0);}
}
});});
return{rushAtt:ra,targets:tg};
}
var hT=cT(hR);var aT=cT(aR);
function enrich(roster,ta,oa,tot,inj){
['qb','rb','wr','te','k'].forEach(function(pos){(roster[pos]||[]).forEach(function(p){
p._teamAbbr=ta;p._oppAbbr=oa;p._teamRushAtt=tot.rushAtt;p._teamTargets=tot.targets;p._injuredTeammates=inj;
});});
}
enrich(hR,m.home.abbr,m.away.abbr,hT,hI);
enrich(aR,m.away.abbr,m.home.abbr,aT,aI);

function processLegs(roster,tAbbr,oAbbr,tStats,oStats,gameLabel){
['qb','rb','wr','te'].forEach(function(pk){
(roster[pk]||[]).forEach(function(p){
if(!p.statCats||Object.keys(p.statCats).length===0||!p.starter)return;

/* Props */
var props=calcPlayerProps(p,tStats,oStats);
if(props.lines&&props.lines.length>0){
var bestLine=null;var bestDiff=-999;
props.lines.forEach(function(l){
if(l.avg>0){var diff=(l.projected/l.avg-1)*100;if(diff>bestDiff){bestDiff=diff;bestLine=l;}}
});
if(bestLine&&bestDiff>2){
allLegs.push({
name:p.name,pos:p.pos,team:tAbbr,opp:oAbbr,game:gameLabel,
prop:bestLine.prop,avg:bestLine.avg,projected:bestLine.projected,
diff:bestDiff,matchup:props.matchup,confidence:props.confidence||'MED',
corr:tAbbr+'_'+p.pos
});
}
}

/* TDs */
var td=calcAnytimeTDProb(p,tStats.rzPct||55,oStats.papg||22);
if(td.prob>=0.20){
allTDLegs.push({
name:p.name,pos:p.pos,team:tAbbr,opp:oAbbr,game:gameLabel,
prob:td.prob,tdRate:td.tdRate,totalTDs:td.totalTDs,
confidence:td.confidence||'MED',corr:tAbbr+'_TD'
});
}
});
});
}
var gl=m.home.abbr+' vs '+m.away.abbr;
processLegs(hR,m.home.abbr,m.away.abbr,hS,aS,gl);
processLegs(aR,m.away.abbr,m.home.abbr,aS,hS,gl);
});

/* Sort legs by edge */
allLegs.sort(function(a,b){return b.diff-a.diff;});
allTDLegs.sort(function(a,b){return b.prob-a.prob;});

/* ===== BUILD PARLAYS ===== */
var sgpParlays=[];
var crossParlays=[];
var tdParlays=[];

/* --- SGP: Same Game Parlays (2-3 legs from same game) --- */
var gameMap={};
allLegs.forEach(function(l){if(!gameMap[l.game])gameMap[l.game]=[];gameMap[l.game].push(l);});
Object.keys(gameMap).forEach(function(game){
var legs=gameMap[game];
if(legs.length<2)return;
/* 2-leg SGP: top 2 from same game, avoid correlation */
for(var i=0;i<Math.min(legs.length,3);i++){
for(var j=i+1;j<Math.min(legs.length,4);j++){
var l1=legs[i],l2=legs[j];
var correlated=(l1.team===l2.team&&((l1.pos==='QB'&&l2.pos==='WR')||(l1.pos==='QB'&&l2.pos==='TE')||(l1.pos==='WR'&&l2.pos==='QB')||(l1.pos==='TE'&&l2.pos==='QB')));
var avgConf=(l1.diff+l2.diff)/2;
sgpParlays.push({
game:game,legs:[l1,l2],avgEdge:avgConf,correlated:correlated,
legCount:2,impliedProb:Math.max(0.05,0.55*0.55)
});
}
}
/* 3-leg SGP */
if(legs.length>=3){
sgpParlays.push({
game:game,legs:legs.slice(0,3),avgEdge:(legs[0].diff+legs[1].diff+legs[2].diff)/3,
correlated:true,legCount:3,impliedProb:Math.max(0.03,0.50*0.50*0.50)
});
}
});
sgpParlays.sort(function(a,b){return b.avgEdge-a.avgEdge;});

/* --- Cross-Game Parlays: best legs from different games --- */
if(allLegs.length>=2){
/* 2-leg cross */
var used={};
var crossLegs2=[];
allLegs.forEach(function(l){
if(crossLegs2.length>=2)return;
if(!used[l.game]){used[l.game]=true;crossLegs2.push(l);}
});
if(crossLegs2.length>=2){
crossParlays.push({legs:crossLegs2,avgEdge:(crossLegs2[0].diff+crossLegs2[1].diff)/2,legCount:2,impliedProb:0.55*0.55});
}
/* 3-leg cross */
used={};var crossLegs3=[];
allLegs.forEach(function(l){
if(crossLegs3.length>=3)return;
if(!used[l.game]){used[l.game]=true;crossLegs3.push(l);}
});
if(crossLegs3.length>=3){
crossParlays.push({legs:crossLegs3,avgEdge:(crossLegs3[0].diff+crossLegs3[1].diff+crossLegs3[2].diff)/3,legCount:3,impliedProb:0.50*0.50*0.50});
}
/* 4-leg cross */
used={};var crossLegs4=[];
allLegs.forEach(function(l){
if(crossLegs4.length>=4)return;
if(!used[l.game]){used[l.game]=true;crossLegs4.push(l);}
});
if(crossLegs4.length>=4){
crossParlays.push({legs:crossLegs4,avgEdge:(crossLegs4[0].diff+crossLegs4[1].diff+crossLegs4[2].diff+crossLegs4[3].diff)/4,legCount:4,impliedProb:0.45*0.45*0.45*0.45});
}
}

/* --- TD Parlays: combine top Anytime TD picks --- */
if(allTDLegs.length>=2){
/* 2-leg TD */
tdParlays.push({legs:allTDLegs.slice(0,2),avgProb:(allTDLegs[0].prob+allTDLegs[1].prob)/2,legCount:2,impliedProb:allTDLegs[0].prob*allTDLegs[1].prob});
/* 3-leg TD */
if(allTDLegs.length>=3){
tdParlays.push({legs:allTDLegs.slice(0,3),avgProb:(allTDLegs[0].prob+allTDLegs[1].prob+allTDLegs[2].prob)/3,legCount:3,impliedProb:allTDLegs[0].prob*allTDLegs[1].prob*allTDLegs[2].prob});
}
/* 4-leg TD */
if(allTDLegs.length>=4){
tdParlays.push({legs:allTDLegs.slice(0,4),avgProb:(allTDLegs[0].prob+allTDLegs[1].prob+allTDLegs[2].prob+allTDLegs[3].prob)/4,legCount:4,impliedProb:allTDLegs[0].prob*allTDLegs[1].prob*allTDLegs[2].prob*allTDLegs[3].prob});
}
}

/* ===== RENDER RESULTS ===== */
var h='';

/* Helper: implied odds display */
function fmtOdds(prob){
if(prob>=0.5)return '-'+Math.round(prob/(1-prob)*100);
return '+'+Math.round((1-prob)/prob*100);
}

/* Helper: confidence color */
function confClr(matchup){
return matchup==='SMASH'?'#66bb6a':matchup==='GOOD'?'#4fc3f7':matchup==='NEUTRAL'?'#ffd54f':matchup==='TOUGH'?'#ffa726':'#ef5350';
}


/* --- SGP Section (Every Game) --- */
h+='<div style="margin-top:12px">';
h+='<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="var c=this.nextElementSibling;c.style.display=c.style.display===\'none\'?\'block\':\'none\';this.querySelector(\'.min-arrow\').textContent=c.style.display===\'none\'?\'▶\':\'▼\'">';
h+='<div style="font-size:12px;font-weight:900;color:#89CFF0">🎯 Same Game Parlays (SGP)</div><span class="min-arrow" style="color:#89CFF0;font-size:12px">▼</span></div>';
h+='<div>';
h+='<div style="font-size:8px;color:#888;margin:4px 0">Props from the same game combined | ⚡ = correlated legs (move together)</div>';

/* Group SGPs by game */
var sgpByGame={};
sgpParlays.forEach(function(p){
if(!sgpByGame[p.game])sgpByGame[p.game]=[];
sgpByGame[p.game].push(p);
});

var gameNames=Object.keys(sgpByGame);
if(gameNames.length===0){h+='<div class="no-data">Not enough data for SGPs</div>';}
gameNames.forEach(function(game){
var parlays=sgpByGame[game];
var bestEdge=0;
parlays.forEach(function(p){if(p.avgEdge>bestEdge)bestEdge=p.avgEdge;});
var bestClr=bestEdge>=10?'#66bb6a':bestEdge>=5?'#ffd54f':'#ffa726';

/* Each game is collapsible */
h+='<div style="margin:6px 0;border:1px solid rgba(137,207,240,.1);border-radius:6px;overflow:hidden">';
h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:rgba(137,207,240,.05);cursor:pointer" onclick="var c=this.nextElementSibling;c.style.display=c.style.display===\'none\'?\'block\':\'none\';this.querySelector(\'.min-arrow\').textContent=c.style.display===\'none\'?\'▶\':\'▼\'">';
h+='<span style="font-size:10px;font-weight:800;color:#89CFF0">'+game+'</span>';
h+='<span style="font-size:8px"><span style="color:'+bestClr+';font-weight:700">Best: +'+bestEdge.toFixed(1)+'%</span> | <span style="color:#888">'+parlays.length+' combos</span> <span class="min-arrow" style="color:#89CFF0;font-size:10px">▼</span></span>';
h+='</div>';

function enrichTrackerPicks(trk){
if(!trk||!trk.d||!trk.d.p)return;
trk.d.p.forEach(function(e){
/* Infer bet type from bl data if not set */
if(e.bl&&!e.bl.type){
/* Each pick is a ML pick since pk = team picked to win */
e.bl.type='ML';
}
/* Also tag spread and O/U as separate trackable items */
if(e.bl&&!e.bl._enriched){
e.bl._enriched=true;
/* Spread result: did the picked team cover? */
if(e.bl.spread!==undefined&&e.hSc!==null&&e.aSc!==null){
var pickIsHome=(e.pk===e.hT);
var margin=pickIsHome?(e.hSc-e.aSc):(e.aSc-e.hSc);
e.bl._spreadW=pickIsHome?(margin>Math.abs(e.bl.spread)):(margin>Math.abs(e.bl.spread));
}
/* O/U result: did total go over or under? */
if(e.bl.ouLine&&e.hSc!==null&&e.aSc!==null){
var totalPts=e.hSc+e.aSc;
e.bl._ouActual=totalPts;
e.bl._ouW=(e.bl.ouPk==='Over'&&totalPts>e.bl.ouLine)||(e.bl.ouPk==='Under'&&totalPts<e.bl.ouLine);
}
}
/* Infer week from game ID (nfl_401873010 format) or timestamp */
if(!e.wk&&e.ts){
/* Estimate NFL week from timestamp */
/* NFL 2026 Week 1 starts ~Sep 10, 2026 = 1789084800000 */
var nflStart=1789084800000;
var weekMs=7*24*60*60*1000;
var wk=Math.floor((e.ts-nflStart)/weekMs)+1;
if(wk<1)wk=1;if(wk>18)wk=18;
e.wk=wk;
}
});
}

function updateParlaySlip(){

var countEl=document.getElementById('ps-count');
var picksEl=document.getElementById('ps-picks');
var payoutEl=document.getElementById('ps-payout');
if(parlayPicks.length===0){slip.classList.remove('on');return;}

parlayPicks.forEach(function(p,idx){

});
picksEl.innerHTML=h;
var combinedOdds=1;
parlayPicks.forEach(function(p){
var o=parseInt(p.odds)||(-110);
var dec=o>0?(o/100+1):(100/Math.abs(o)+1);
combinedOdds*=dec;
});
var americanOdds=combinedOdds>=2?Math.round((combinedOdds-1)*100):Math.round(-100/(combinedOdds-1));
var payout=(Bank.d.unit*combinedOdds).toFixed(2);
payoutEl.style.display='block';
payoutEl.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid rgba(137,207,240,.1)"><div><span style="font-size:10px;color:#888">Odds: </span><strong>'+(americanOdds>0?'+':'')+americanOdds+'</strong> <span style="font-size:10px;color:#888">| Payout: </span><strong style="color:#66bb6a">$'+payout+'</strong></div><button class="ps-save-btn" id="ps-save">Save Parlay</button></div>';
picksEl.querySelectorAll('[data-rm-leg]').forEach(function(btn){

});

});
});

updateParlaySlip();
playSound('win');
});
}

(sched.dates||[]).forEach(function(dt){

var gpk='mlb_'+gm.gamePk;
var hSc=gm.teams.home.score||0;
var aSc=gm.teams.away.score||0;
var inn1h=gm.linescore&&gm.linescore.innings&&gm.linescore.innings[0]?gm.linescore.innings[0].home.runs:0;
var inn1a=gm.linescore&&gm.linescore.innings&&gm.linescore.innings[0]?gm.linescore.innings[0].away.runs:0;
Trk.score(gpk,hSc,aSc,inn1h,inn1a);
});
});
}).catch(function(){});
}
if(SPORT==='nfl'){
fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard')
.then(function(r){return r.json();})
.then(function(d){
(d.events||[]).forEach(function(ev){
var comp=ev.competitions&&ev.competitions[0];
if(!comp)return;
var status=comp.status&&comp.status.type&&comp.status.type.completed;
if(!status)return;
var gpk='nfl_'+ev.id;
var hSc=0,aSc=0;
(comp.competitors||[]).forEach(function(c){
if(c.homeAway==='home')hSc=parseInt(c.score)||0;
if(c.homeAway==='away')aSc=parseInt(c.score)||0;
});
/* Score the pick */
nflTrk.d.p.forEach(function(e){
if(e.g===gpk&&e.w===null){
e.hSc=hSc;
e.aSc=aSc;
/* ML win: did the picked team win? */
var pickIsHome=(e.pk===e.hT);
e.w=pickIsHome?(hSc>aSc):(aSc>hSc);
}
});
});
nflTrk.save();
}).catch(function(){});
}
if(SPORT==='nba'){
fetch(NBA_BASE+'/scoreboard')
.then(function(r){return r.json();})
.then(function(d){
(d.events||[]).forEach(function(ev){
var comps=ev.competitions||[];
if(comps.length===0)return;
var comp=comps[comps.length>0?0:0];
var st=comp.status&&comp.status.type;
if(!st||!st.completed)return;
var gpk='nba_'+ev.id;
var hSc=0,aSc=0,hAbbr='',aAbbr='';
(comp.competitors||[]).forEach(function(c){
if(c.homeAway==='home'){hSc=parseInt(c.score)||0;hAbbr=c.team.abbreviation;}
if(c.homeAway==='away'){aSc=parseInt(c.score)||0;aAbbr=c.team.abbreviation;}
});
var winner=hSc>aSc?hAbbr:aAbbr;
nbaTrk.d.p.forEach(function(e){
if(e.g===gpk&&e.w===null){
e.hSc=hSc;
e.aSc=aSc;
e.w=(e.pk===winner);
}
});
});
nbaTrk.save();
/* Apply glow after scoring */
document.querySelectorAll('.gc[data-gpk^="nba_"]').forEach(function(card){
var gpk=card.getAttribute('data-gpk');
var te=nbaTrk.d.p.find(function(x){return x.g===gpk;});
if(te&&te.w===true){card.classList.remove('glow-loss');card.classList.add('glow-win');}
else if(te&&te.w===false){card.classList.remove('glow-win');card.classList.add('glow-loss');}
});
}).catch(function(){});
}
}

liveGames.push({
gpk:'mlb_'+gm.gamePk,
hT:gm.teams.home.team.abbreviation||'HOME',
aT:gm.teams.away.team.abbreviation||'AWAY',

});

var aSc=gm.teams.away.score||0;
var inn1h=gm.linescore&&gm.linescore.innings&&gm.linescore.innings?gm.linescore.innings.home.runs:0;

}
}
}
});
});
liveGames.forEach(function(lg){

if(prev&&(prev.hSc!==lg.hSc||prev.aSc!==lg.aSc)){
playSound('score');
sendNotif('Score Update',lg.hT+' '+lg.hSc+' - '+lg.aT+' '+lg.aSc+' ('+lg.half+' '+lg.inn+')');
}
prevLiveStates[lg.gpk]=lg;
});

/* --- Lineups, BvP Splits, Batter Props --- */
async function fetchLineup(gpk){
try{
var gid=gpk.replace('mlb_','');
var d=await gfetch('https://statsapi.mlb.com/api/v1.1/game/'+gid+'/feed/live');
var home=[],away=[];
if(d.liveData&&d.liveData.boxscore){
var hB=d.liveData.boxscore.teams.home;
var aB=d.liveData.boxscore.teams.away;
if(hB.battingOrder)hB.battingOrder.forEach(function(id){
var p=hB.players['ID'+id];
if(p)home.push({name:p.person.fullName,pos:p.position.abbreviation,avg:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.avg:'--',hr:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.homeRuns:'--',rbi:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.rbi:'--',ops:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.ops:'--'});
});
if(aB.battingOrder)aB.battingOrder.forEach(function(id){
var p=aB.players['ID'+id];
if(p)away.push({name:p.person.fullName,pos:p.position.abbreviation,avg:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.avg:'--',hr:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.homeRuns:'--',rbi:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.rbi:'--',ops:p.seasonStats&&p.seasonStats.batting?p.seasonStats.batting.ops:'--'});
});
}
return{home:home,away:away};
}catch(e){return{home:[],away:[]};}
}

/* --- Pitcher Prop Predictions --- */
function renderPitcherProps(hSP,aSP,hTeam,aTeam,hD,aD){
if(!hSP&&!aSP)return'<div style="color:#888;font-size:10px;padding:4px">Pitcher prop data not available</div>';
function projK(sp,oppD){
if(!sp)return{val:5.0,conf:'Low'};
var k9=sp.k9||7.0;
var ip=sp.ip||80;
var avgIP=ip/(sp.gs||15);
var oppK=oppD&&oppD.hit?(1-(oppD.hit.avg||0.250))*1.2:1.0;
var predK=((k9/9)*avgIP)*oppK;
predK=Math.max(2,Math.min(14,predK));
var conf=sp.gs>=10?'High':(sp.gs>=5?'Med':'Low');
return{val:predK,conf:conf};
}
function projHits(sp,oppD){
if(!sp)return{val:6.0,conf:'Low'};
var whip=sp.whip||1.30;
var ip=sp.ip||80;
var avgIP=ip/(sp.gs||15);
var bb9=sp.bb9||3.0;
var hPer9=((whip*9)-bb9);
var predH=(hPer9/9)*avgIP;
var oppAvg=oppD&&oppD.hit?oppD.hit.avg||0.250:0.250;
predH=predH*(oppAvg/0.250);
predH=Math.max(2,Math.min(12,predH));
var conf=sp.gs>=10?'High':(sp.gs>=5?'Med':'Low');
return{val:predH,conf:conf};
}
function projER(sp,oppD){
if(!sp)return{val:3.0,conf:'Low'};
var era=sp.era||4.50;
var ip=sp.ip||80;
var avgIP=ip/(sp.gs||15);
var predER=(era/9)*avgIP;
var oppOps=oppD&&oppD.hit?oppD.hit.ops||0.720:0.720;
predER=predER*(oppOps/0.720);
predER=Math.max(0,Math.min(8,predER));
var conf=sp.gs>=10?'High':(sp.gs>=5?'Med':'Low');
return{val:predER,conf:conf};
}
var hK=projK(hSP,aD),aK=projK(aSP,hD);
var hH=projHits(hSP,aD),aH=projHits(aSP,hD);
var hER=projER(hSP,aD),aER=projER(aSP,hD);
function confClr(c){return c==='High'?'#66bb6a':(c==='Med'?'#ffd54f':'#ef5350');}
function propRow(label,hVal,hConf,aVal,aConf,lower){
var hBetter=lower?(hVal<=aVal):(hVal>=aVal);
var aBetter=!hBetter;
if(hVal===aVal){hBetter=false;aBetter=false;}
var hClr=hBetter?'#66bb6a':'#e0e0e0';
var aClr=aBetter?'#66bb6a':'#e0e0e0';
var r='<tr style="border-bottom:1px solid rgba(137,207,240,.04)">';
r+='<td style="padding:4px;text-align:center;font-weight:800;color:'+hClr+'">'+hVal.toFixed(1)+'</td>';
r+='<td style="text-align:center;font-size:8px;color:'+confClr(hConf)+'">'+hConf+'</td>';
r+='<td style="text-align:center;color:#89CFF0;font-weight:700;font-size:10px">'+label+'</td>';
r+='<td style="text-align:center;font-size:8px;color:'+confClr(aConf)+'">'+aConf+'</td>';
r+='<td style="padding:4px;text-align:center;font-weight:800;color:'+aClr+'">'+aVal.toFixed(1)+'</td>';

/* ===== NFL PLAYER STATS AGGREGATOR ===== */
var NFLPlayerStatsCache={};

async function fetchNFLPlayerStats(teamId){
if(NFLPlayerStatsCache[teamId])return NFLPlayerStatsCache[teamId];
try{
/* Step 1: Get completed game IDs from schedule */
var schedRes=await fetch('https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/teams/'+teamId+'/schedule');
var schedData=await schedRes.json();
var gameIds=[];
(schedData.events||[]).forEach(function(ev){
var comp=ev.competitions&&ev.competitions[0];
if(comp&&comp.status&&comp.status.type&&comp.status.type.name==='STATUS_FINAL'){
gameIds.push(ev.id);
}
});
if(gameIds.length===0){NFLPlayerStatsCache[teamId]={};return{};}

/* Step 2: Fetch all boxscores in parallel */
var boxscores=await Promise.all(gameIds.map(function(gid){
return fetch('https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/summary?event='+gid)
.then(function(r){return r.json();})
.catch(function(){return null;});
}));

/* Step 3: Aggregate stats per player */
var playerMap={};
var gamesPlayed=gameIds.length;

boxscores.forEach(function(box){
if(!box||!box.boxscore||!box.boxscore.players)return;
(box.boxscore.players||[]).forEach(function(teamBlock){
var tid=teamBlock.team&&teamBlock.team.id;
if(String(tid)!==String(teamId))return;
(teamBlock.statistics||[]).forEach(function(cat){
var labels=cat.labels||[];
var catName=cat.name||'';
(cat.athletes||[]).forEach(function(a){
var pid=a.athlete&&a.athlete.id;
if(!pid)return;
if(!playerMap[pid]){
playerMap[pid]={
id:pid,
name:a.athlete.displayName||'',
games:0,
cats:{}
};
}
if(!playerMap[pid].cats[catName]){
playerMap[pid].cats[catName]={labels:labels,totals:[],gameCount:0};
}
var pc=playerMap[pid].cats[catName];
pc.gameCount++;
var vals=a.stats||[];
/* Parse and sum numeric values */
if(pc.totals.length===0){
pc.totals=vals.map(function(v){
if(v.indexOf('/')>=0){
var parts=v.split('/');
return{type:'frac',num:parseFloat(parts[0])||0,den:parseFloat(parts[1])||0};
}
return{type:'num',val:parseFloat(v)||0};
});
}else{
vals.forEach(function(v,i){
if(!pc.totals[i])return;
if(v.indexOf('/')>=0){
var parts=v.split('/');
pc.totals[i].num+=(parseFloat(parts[0])||0);
pc.totals[i].den+=(parseFloat(parts[1])||0);
}else{
pc.totals[i].val+=(parseFloat(v)||0);
}
});
}
if(pc.gameCount>playerMap[pid].games)playerMap[pid].games=pc.gameCount;
});
});
});
});

/* Step 4: Calculate per-game averages and season totals */
for(var pid in playerMap){
var p=playerMap[pid];
for(var catName in p.cats){
var pc=p.cats[catName];
var gp=pc.gameCount||1;
pc.seasonDisplay=pc.totals.map(function(t,i){
if(t.type==='frac')return Math.round(t.num)+'/'+Math.round(t.den);
/* For AVG, PCT, RTG, QBR — don't sum, divide */
var label=(pc.labels[i]||'').toUpperCase();
if(label.indexOf('AVG')>=0||label.indexOf('PCT')>=0||label.indexOf('RTG')>=0||label.indexOf('QBR')>=0){
return(t.val/gp).toFixed(1);
}
return Math.round(t.val);
}).join(', ');
pc.avgDisplay=pc.totals.map(function(t,i){
var label=(pc.labels[i]||'').toUpperCase();
if(t.type==='frac')return(t.num/gp).toFixed(1)+'/'+(t.den/gp).toFixed(1);
if(label.indexOf('AVG')>=0||label.indexOf('PCT')>=0||label.indexOf('RTG')>=0||label.indexOf('QBR')>=0){
return(t.val/gp).toFixed(1);
}
return(t.val/gp).toFixed(1);
}).join(', ');
}
}

NFLPlayerStatsCache[teamId]={players:playerMap,gamesPlayed:gamesPlayed};
return NFLPlayerStatsCache[teamId];
}catch(e){
console.warn('Stats aggregation error team '+teamId+':',e);
NFLPlayerStatsCache[teamId]={players:{},gamesPlayed:0};
return NFLPlayerStatsCache[teamId];
}
}

/* ===== SMART STARTER DETECTION ===== */
/* Position starter quotas: how many starters per position */
var starterSlots={qb:1,rb:2,wr:3,te:1,ol:5,dl:3,lb:3,db:4,k:1,p:1};

/* Helper: get primary stat volume for ranking */
function getStatVolume(p,posKey){
var vol=0;
if(!p.statCats)return 0;
if(posKey==='qb'&&p.statCats.passing){
var pt=p.statCats.passing.totals||[];
if(pt[0]&&pt[0].type==='frac')vol=pt[0].den||0;/* pass attempts */
}else if((posKey==='rb')&&p.statCats.rushing){
var rt=p.statCats.rushing.totals||[];
if(rt[0])vol=(rt[0].val||rt[0].num||0);/* carries */
}else if((posKey==='wr'||posKey==='te')&&p.statCats.receiving){
var rc=p.statCats.receiving.totals||[];
if(rc[5])vol=(rc[5].val||rc[5].num||0);/* targets */
else if(rc[0])vol=(rc[0].val||rc[0].num||0);/* receptions */
}else if(posKey==='k'&&p.statCats.kicking){
var kt=p.statCats.kicking.totals||[];
if(kt[0]&&kt[0].type==='frac')vol=kt[0].den||0;/* FG attempts */
}else if(posKey==='p'&&p.statCats.punting){
var pu=p.statCats.punting.totals||[];
if(pu[0])vol=(pu[0].val||pu[0].num||0);/* punts */
}else if((posKey==='dl'||posKey==='lb'||posKey==='db')&&p.statCats.defensive){
var df=p.statCats.defensive.totals||[];
if(df[0])vol=(df[0].val||df[0].num||0);/* total tackles */
}
return vol;
}

/* Helper: check if player is injured (Out or IR) */
function isPlayerOut(p){
return p.status==='out'||p.status==='injured-reserve'||p.status==='injured_reserve'||p.status==='physically-unable'||p.status==='suspended';
}

for(var key in roster){
if(key==='gamesPlayed')continue;
var slots=starterSlots[key]||1;

/* First: reset all starters */
roster[key].forEach(function(p){p.starter=false;});

/* Sort by: 1) not injured first, 2) games played desc, 3) stat volume desc, 4) depth asc */
roster[key].sort(function(a,b){
var aOut=isPlayerOut(a)?1:0;
var bOut=isPlayerOut(b)?1:0;
if(aOut!==bOut)return aOut-bOut;/* healthy players first */
var aGP=a.gamesPlayed||0;
var bGP=b.gamesPlayed||0;
if(bGP!==aGP)return bGP-aGP;/* more games played = higher */
var aVol=getStatVolume(a,key);
var bVol=getStatVolume(b,key);
if(bVol!==aVol)return bVol-aVol;/* more volume = higher */
return a.depth-b.depth;/* ESPN depth order as tiebreaker */
});

/* Mark top N healthy players as starters based on position slots */
var startersMarked=0;
roster[key].forEach(function(p){
if(startersMarked>=slots)return;
if(!isPlayerOut(p)&&p.gamesPlayed>0){
p.starter=true;
startersMarked++;
}
});
/* Fallback: if no healthy players with stats, mark first healthy player */
if(startersMarked===0){
for(var si=0;si<roster[key].length;si++){
if(!isPlayerOut(roster[key][si])){
roster[key][si].starter=true;
break;
}
}
}
}

NFLRosterCache[teamId]=roster;
return roster;
}catch(e){console.warn('Roster error team '+teamId+':',e);return{qb:[],rb:[],wr:[],te:[],ol:[],dl:[],lb:[],db:[],k:[],p:[],gamesPlayed:0};}
}

/* ===== PLAYER PROPS PREDICTION MODEL ===== */

function calcPlayerProps(player,teamStats,oppStats){
var gp=player.gamesPlayed||1;
var props={pos:player.pos,name:player.name,team:'',opp:'',starter:player.starter||false};

/* Extract raw stats from statCats */
var passYds=0,passTDs=0,comps=0,attempts=0,ints=0,rushYds=0,rushAtt=0,rushTDs=0;
var recYds=0,recs=0,recTDs=0,tgts=0;
var fgm=0,fga=0,xpm=0,xpa=0,kickPts=0;

if(player.statCats){
if(player.statCats.passing){
var pt=player.statCats.passing.totals||[];
if(pt[0]&&pt[0].type==='frac'){comps=pt[0].num||0;attempts=pt[0].den||0;}
if(pt[1])passYds=(pt[1].type==='frac'?pt[1].num:pt[1].val)||0;
if(pt[3])passTDs=(pt[3].type==='frac'?pt[3].num:pt[3].val)||0;
if(pt[4])ints=(pt[4].type==='frac'?pt[4].num:pt[4].val)||0;
}
if(player.statCats.rushing){
var rt=player.statCats.rushing.totals||[];
if(rt[0])rushAtt=(rt[0].type==='frac'?rt[0].num:rt[0].val)||0;
if(rt[1])rushYds=(rt[1].type==='frac'?rt[1].num:rt[1].val)||0;
if(rt[3])rushTDs=(rt[3].type==='frac'?rt[3].num:rt[3].val)||0;
}
if(player.statCats.receiving){
var rc=player.statCats.receiving.totals||[];
if(rc[0])recs=(rc[0].type==='frac'?rc[0].num:rc[0].val)||0;
if(rc[1])recYds=(rc[1].type==='frac'?rc[1].num:rc[1].val)||0;
if(rc[3])recTDs=(rc[3].type==='frac'?rc[3].num:rc[3].val)||0;
if(rc[5])tgts=(rc[5].type==='frac'?rc[5].num:rc[5].val)||0;
}
if(player.statCats.kicking){
var kt=player.statCats.kicking.totals||[];
if(kt[0]&&kt[0].type==='frac'){fgm=kt[0].num||0;fga=kt[0].den||0;}
if(kt[3]&&kt[3].type==='frac'){xpm=kt[3].num||0;xpa=kt[3].den||0;}
if(kt[4])kickPts=(kt[4].type==='frac'?kt[4].num:kt[4].val)||0;
}
}

/* Per-game averages */
var passYpg=passYds/gp;
var passTDpg=passTDs/gp;
var compPg=comps/gp;
var attPg=attempts/gp;
var intPg=ints/gp;
var rushYpg=rushYds/gp;
var rushAttPg=rushAtt/gp;
var recYpg=recYds/gp;
var recPg=recs/gp;
var tgtPg=tgts/gp;
var fgmPg=fgm/gp;
var xpmPg=xpm/gp;
var kickPtsPg=kickPts/gp;

/* ===== MATCHUP ADJUSTMENTS ===== */
var oppPapg=oppStats.papg||22;
var oppPassYapg=oppStats.passYapg||230;
var oppRushYapg=oppStats.rushYapg||110;
var teamPpg=teamStats.ppg||22;

/* Factor 1: Opponent Defensive Strength (amplified) */
/* League averages: 22 ppg, 230 pass yapg, 110 rush yapg */
/* Use exponential scaling so bad defenses get punished more */
var passDefRatio=oppPassYapg/230;
var rushDefRatio=oppRushYapg/110;
var ptsDefRatio=oppPapg/22;

/* Amplify the ratio — square it to make differences matter more */
/* Use papg ratio as the PRIMARY driver since yapg is estimated from papg */
/* This prevents double-counting the same signal */
var passMultRaw=1+(ptsDefRatio-1)*1.2;
var rushMultRaw=1+(ptsDefRatio-1)*1.0;
var ptsMultRaw=1+(ptsDefRatio-1)*1.2;
/* Fine-tune: if we have real pass/rush yapg that differs from pts ratio, blend it in */
if(Math.abs(passDefRatio-ptsDefRatio)>0.05){
passMultRaw=passMultRaw*0.6+((1+(passDefRatio-1)*1.2))*0.4;
}
if(Math.abs(rushDefRatio-ptsDefRatio)>0.05){
rushMultRaw=rushMultRaw*0.6+((1+(rushDefRatio-1)*1.0))*0.4;
}

/* Clamp multipliers to realistic range (0.70 to 1.40) */
var passMult=Math.max(0.78,Math.min(1.28,passMultRaw));
var rushMult=Math.max(0.78,Math.min(1.28,rushMultRaw));
var ptsMult=Math.max(0.78,Math.min(1.28,ptsMultRaw));

/* Factor 2: Game Script — favorites run more, underdogs throw more */
var teamPdiff=teamStats.pdiff||0;
var oppPdiff=oppStats.pdiff||0;
var gpTeam=teamStats.w+teamStats.l||1;
var pdiffPg=teamPdiff/gpTeam;
var isFavorite=teamPpg>oppPapg;
/* If team is big favorite (+7 pdiff/g), they'll run more and throw less */
var scriptPassAdj=1.0;
var scriptRushAdj=1.0;
/* Only adjust game script for BLOWOUT mismatches (pdiff > 8) */
/* Competitive games = both teams put up yards */
if(pdiffPg>8){scriptPassAdj=0.95;scriptRushAdj=1.08;}
else if(pdiffPg<-8){scriptPassAdj=1.06;scriptRushAdj=0.94;}
/* Close games: BOOST both — competitive games = more total yards */
else if(Math.abs(pdiffPg)<=3){scriptPassAdj=1.04;scriptRushAdj=1.04;}

/* Factor 3: Pace / Scoring Environment */
/* Higher combined scoring = more opportunities for everyone */
var combinedPpg=teamPpg+oppPapg;
var paceAdj=combinedPpg/44;/* 44 = league avg combined */
paceAdj=Math.max(0.85,Math.min(1.20,paceAdj));

/* Factor 4: Rest advantage */
var restDays=teamStats.rest||7;
var restAdj=restDays>=10?1.03:restDays<=3?0.97:1.0;

/* Factor 5: Streak momentum */
var streak=teamStats.streak||0;
var streakAdj=streak>=3?1.04:streak<=-3?0.96:1.0;


/* Factor 6: Target/Touch Share — alpha players get boosted */
var carries=0,targets=0,teamRushAtt=0,teamTargets=0;
if(player.statCats){
if(player.statCats.rushing){var prt=player.statCats.rushing.totals||[];if(prt[0])carries=(prt[0].val||prt[0].num||0);}
if(player.statCats.receiving){var prc=player.statCats.receiving.totals||[];if(prc[5])targets=(prc[5].val||prc[5].num||0);else if(prc[0])targets=(prc[0].val||prc[0].num||0);}
}
/* Calculate share from team totals in roster */
var shareAdj=1.0;
if(player._teamRushAtt)teamRushAtt=player._teamRushAtt;
if(player._teamTargets)teamTargets=player._teamTargets;
var rushShare=teamRushAtt>0?carries/teamRushAtt:0;
var tgtShare=teamTargets>0?targets/teamTargets:0;
/* Bellcow RB (>50% rush share) or Alpha WR (>25% target share) get boosted */
if(player.pos==='RB'||player.pos==='FB'){
if(rushShare>=0.50)shareAdj=1.08;
else if(rushShare>=0.35)shareAdj=1.04;
else if(rushShare<0.15&&carries>0)shareAdj=0.92;
}
if(player.pos==='WR'||player.pos==='TE'){
if(tgtShare>=0.25)shareAdj=1.08;
else if(tgtShare>=0.18)shareAdj=1.04;
else if(tgtShare<0.08&&targets>0)shareAdj=0.92;
}

/* Factor 7: Weather Impact on Passing */
/* wx factor is negative = bad weather, 0 = dome/fair */
var wxFactor=teamStats.wxFactor||0;
var wxPassAdj=1.0;
var wxRushAdj=1.0;
if(wxFactor<-0.01){
/* Bad weather: reduce passing, boost rushing */
wxPassAdj=0.92;
wxRushAdj=1.06;
}else if(wxFactor<-0.005){
/* Moderate weather: slight passing reduction */
wxPassAdj=0.96;
wxRushAdj=1.03;
}

/* Factor 8: Division Rival Adjustment */
/* Division games are tighter, more physical, lower scoring */
var NFL_DIVISIONS={
AFCN:['BAL','CIN','CLE','PIT'],AFCS:['HOU','IND','JAX','TEN'],
AFCE:['BUF','MIA','NE','NYJ'],AFCW:['DEN','KC','LAC','LV'],
NFCN:['CHI','DET','GB','MIN'],NFCS:['ATL','CAR','NO','TB'],
NFCE:['DAL','NYG','PHI','WSH','WAS'],NFCW:['ARI','LAR','SEA','SF']
};
var isDivRival=false;
var teamAbbr=player._teamAbbr||'';
var oppAbbr=player._oppAbbr||'';
Object.keys(NFL_DIVISIONS).forEach(function(div){
var teams=NFL_DIVISIONS[div];
if(teams.indexOf(teamAbbr.toUpperCase())>=0&&teams.indexOf(oppAbbr.toUpperCase())>=0){
isDivRival=true;
}
});
var divAdj=isDivRival?0.96:1.0;

/* Factor 9: Injury Teammate Impact */
/* If key teammates are out, remaining players get more opportunity */
var injBoost=1.0;
if(player._injuredTeammates){
var injList=player._injuredTeammates;
injList.forEach(function(inj){
/* If a WR/TE is out and this player is WR/TE, boost targets */
if((inj.pos==='WR'||inj.pos==='TE')&&(player.pos==='WR'||player.pos==='TE')&&inj.name!==player.name){
if(inj.status==='Out'||inj.status==='Doubtful')injBoost+=0.06;
else if(inj.status==='Questionable')injBoost+=0.02;
}
/* If RB is out and this player is RB, boost carries */
if(inj.pos==='RB'&&player.pos==='RB'&&inj.name!==player.name){
if(inj.status==='Out'||inj.status==='Doubtful')injBoost+=0.10;
else if(inj.status==='Questionable')injBoost+=0.03;
}
});
injBoost=Math.min(1.25,injBoost);
}

/* Combined multipliers by stat type */
var finalPassMult=passMult*scriptPassAdj*paceAdj*restAdj*streakAdj*wxPassAdj*divAdj*shareAdj*injBoost;
var finalRushMult=rushMult*scriptRushAdj*paceAdj*restAdj*streakAdj*wxRushAdj*divAdj*shareAdj*injBoost;
var finalPtsMult=ptsMult*paceAdj*restAdj*streakAdj*divAdj*injBoost;

/* Clamp final multipliers */
finalPassMult=Math.max(0.60,Math.min(1.50,finalPassMult));
finalRushMult=Math.max(0.60,Math.min(1.50,finalRushMult));
finalPtsMult=Math.max(0.60,Math.min(1.50,finalPtsMult));

/* Projection: 55% season avg + 45% matchup adjusted */
var project=function(avg,mult){return avg*0.55+avg*mult*0.45;};

/* Build props based on position */
props.lines=[];
props.factors={passMult:finalPassMult,rushMult:finalRushMult,ptsMult:finalPtsMult,paceAdj:paceAdj,scriptPass:scriptPassAdj,scriptRush:scriptRushAdj,restAdj:restAdj,streakAdj:streakAdj,wxPassAdj:wxPassAdj,wxRushAdj:wxRushAdj,divAdj:divAdj,shareAdj:shareAdj,injBoost:injBoost};

if(player.pos==='QB'){
props.lines.push({prop:'Pass Yds',avg:passYpg,projected:project(passYpg,finalPassMult),season:passYds,gp:gp});
props.lines.push({prop:'Pass TDs',avg:passTDpg,projected:project(passTDpg,finalPassMult),season:passTDs,gp:gp});
props.lines.push({prop:'Completions',avg:compPg,projected:project(compPg,finalPassMult),season:comps,gp:gp});
props.lines.push({prop:'INTs',avg:intPg,projected:project(intPg,1/finalPassMult),season:ints,gp:gp});/* INTs inverse — good matchup = fewer INTs */
props.lines.push({prop:'Rush Yds',avg:rushYpg,projected:project(rushYpg,finalRushMult),season:rushYds,gp:gp});
props.lines.push({prop:'Attempts',avg:attPg,projected:project(attPg,finalPassMult),season:attempts,gp:gp});
}
else if(player.pos==='RB'||player.pos==='FB'){
props.lines.push({prop:'Rush Yds',avg:rushYpg,projected:project(rushYpg,finalRushMult),season:rushYds,gp:gp});
props.lines.push({prop:'Rush Att',avg:rushAttPg,projected:project(rushAttPg,finalRushMult),season:rushAtt,gp:gp});
props.lines.push({prop:'Receptions',avg:recPg,projected:project(recPg,finalPassMult),season:recs,gp:gp});
props.lines.push({prop:'Rec Yds',avg:recYpg,projected:project(recYpg,finalPassMult),season:recYds,gp:gp});
props.lines.push({prop:'Total Yds',avg:(rushYpg+recYpg),projected:project(rushYpg,finalRushMult)+project(recYpg,finalPassMult),season:rushYds+recYds,gp:gp});
}
else if(player.pos==='WR'){
props.lines.push({prop:'Rec Yds',avg:recYpg,projected:project(recYpg,finalPassMult),season:recYds,gp:gp});
props.lines.push({prop:'Receptions',avg:recPg,projected:project(recPg,finalPassMult),season:recs,gp:gp});
props.lines.push({prop:'Targets',avg:tgtPg,projected:project(tgtPg,finalPassMult),season:tgts,gp:gp});
props.lines.push({prop:'Total Yds',avg:(recYpg+rushYpg),projected:project(recYpg,finalPassMult)+project(rushYpg,finalRushMult),season:recYds+rushYds,gp:gp});
}
else if(player.pos==='TE'){
props.lines.push({prop:'Rec Yds',avg:recYpg,projected:project(recYpg,finalPassMult),season:recYds,gp:gp});
props.lines.push({prop:'Receptions',avg:recPg,projected:project(recPg,finalPassMult),season:recs,gp:gp});
props.lines.push({prop:'Targets',avg:tgtPg,projected:project(tgtPg,finalPassMult),season:tgts,gp:gp});
}
else if(player.pos==='K'||player.pos==='PK'){
props.lines.push({prop:'FG Made',avg:fgmPg,projected:project(fgmPg,finalPtsMult),season:fgm,gp:gp});
props.lines.push({prop:'Kick Pts',avg:kickPtsPg,projected:project(kickPtsPg,finalPtsMult),season:kickPts,gp:gp});
props.lines.push({prop:'XP Made',avg:xpmPg,projected:project(xpmPg,finalPtsMult),season:xpm,gp:gp});
}

/* Matchup rating — based on combined multiplier impact */
var avgMult=(finalPassMult+finalRushMult)/2;
if(avgMult>=1.15)props.matchup='SMASH';
else if(avgMult>=1.06)props.matchup='GOOD';
else if(avgMult>=0.95)props.matchup='NEUTRAL';
else if(avgMult>=0.85)props.matchup='TOUGH';
else props.matchup='AVOID';

return props;
}

function calcAnytimeTDProb(player,teamRzPct,oppPapg,oppDef){
/* Factor 1: TD Rate (35%) — TDs per game */
var totalTDs=0;
var gp=player.gamesPlayed||1;
var carries=0,targets=0;

/* Count TDs from all stat categories */

if(player.statCats){
if(player.statCats.rushing){
var rt=player.statCats.rushing.totals||[];
if(rt[3])totalTDs+=(rt[3].type==='frac'?rt[3].num:rt[3].val)||0;
if(rt[0])carries=(rt[0].type==='frac'?rt[0].num:rt[0].val)||0;
}
if(player.statCats.receiving){
var rc=player.statCats.receiving.totals||[];
if(rc[3])totalTDs+=(rc[3].type==='frac'?rc[3].num:rc[3].val)||0;
if(rc[5])targets=(rc[5].type==='frac'?rc[5].num:rc[5].val)||0;
else if(rc[0])targets=(rc[0].type==='frac'?rc[0].num:rc[0].val)||0;
}
/* QBs: Do NOT count passing TDs — only rushing TDs count for Anytime TD bets */
/* Passing TDs are already excluded since we only pull from rushing + receiving above */
}

var tdRate=totalTDs/gp;
var tdRateScore=Math.min(tdRate/1.5,1)*0.35;

/* Factor 2: Opportunity Score (25%) — touches per game */
var touchesPerGame=(carries+targets)/gp;
var oppScore=Math.min(touchesPerGame/20,1)*0.25;

/* Factor 3: Red Zone Factor (20%) — team's RZ scoring % */
var rzScore=(teamRzPct||55)/100*0.20;

/* Factor 4: Starter Boost (10%) */
var starterScore=player.starter?0.10:player.depth<=2?0.05:0.01;

/* Factor 5: Matchup Factor (10%) — opponent allows more points = more TD opportunity */
var matchupScore=Math.min((oppPapg||22)/30,1)*0.10;

/* Combine all factors */
var rawProb=tdRateScore+oppScore+rzScore+starterScore+matchupScore;

/* Scale to realistic probability (cap at 85%, floor at 2%) */
var prob=Math.max(0.02,Math.min(0.85,rawProb));

/* Confidence based on sample size */
var confidence=gp>=4?'HIGH':gp>=2?'MED':'LOW';

return{
prob:prob,
tdRate:tdRate,
totalTDs:totalTDs,
touchesPerGame:touchesPerGame,
gamesPlayed:gp,
confidence:confidence
};
}


function calcFirstTDProb(player,teamRzPct,oppPapg,oppDef){
var gp=player.gamesPlayed||1;
var totalTDs=0;
var carries=0,targets=0,receptions=0;

if(player.statCats){
if(player.statCats.rushing){
var rt=player.statCats.rushing.totals||[];
if(rt[3])totalTDs+=(rt[3].type==='frac'?rt[3].num:rt[3].val)||0;
if(rt[0])carries=(rt[0].type==='frac'?rt[0].num:rt[0].val)||0;
}
if(player.statCats.receiving){
var rc=player.statCats.receiving.totals||[];
if(rc[3])totalTDs+=(rc[3].type==='frac'?rc[3].num:rc[3].val)||0;
if(rc[5])targets=(rc[5].type==='frac'?rc[5].num:rc[5].val)||0;
if(rc[0])receptions=(rc[0].type==='frac'?rc[0].num:rc[0].val)||0;
}
}

var tdRate=totalTDs/gp;
var touchesPerGame=(carries+targets)/gp;

/* Factor 1: TD Rate (30%) — frequent scorers more likely to score first */
var tdRateScore=Math.min(tdRate/1.5,1)*0.30;

/* Factor 2: Early-Game Usage (25%) — high-volume players get early touches */
var usageScore=Math.min(touchesPerGame/20,1)*0.25;

/* Factor 3: Position Weight (20%) — RBs/WRs get first-drive work */
var posWeight=0;
if(player.pos==='RB'||player.pos==='FB')posWeight=0.20;
else if(player.pos==='WR')posWeight=0.16;
else if(player.pos==='TE')posWeight=0.12;
else if(player.pos==='QB')posWeight=0.10;
var posScore=posWeight;

/* Factor 4: Starter Boost (15%) — only starters are on opening drive */
var starterScore=player.starter?0.15:player.depth<=2?0.05:0.01;

/* Factor 5: Matchup (10%) — weaker defenses give up early scores */
var matchupScore;
if(oppDef&&(oppDef.passYapg||oppDef.rushYapg)){
var passD=oppDef.passYapg||230,rushD=oppDef.rushYapg||110,defVal;
if(player.pos==='WR'||player.pos==='TE')defVal=passD/230;
else if(player.pos==='RB'||player.pos==='FB')defVal=rushD/110;
else if(player.pos==='QB')defVal=rushD/110;
else defVal=(passD/230+rushD/110)/2;
matchupScore=Math.min(defVal,1.5)/1.5*0.10;
}else{
matchupScore=Math.min((oppPapg||22)/30,1)*0.10;
}

/* Combine factors */
var rawProb=tdRateScore+usageScore+posScore+starterScore+matchupScore;

/* First TD is much harder than Anytime TD — scale down significantly */
/* In a typical NFL game, ~50 eligible players but only 1 scores first */
/* Scale to realistic range: cap at 15%, floor at 0.5% */
var prob=Math.max(0.005,Math.min(0.15,rawProb*0.25));

/* Convert to implied American odds */
var impliedOdds;
if(prob>=0.5){impliedOdds='-'+(Math.round(prob/(1-prob)*100));}
else{impliedOdds='+'+(Math.round((1-prob)/prob*100));}

return{
prob:prob,
tdRate:tdRate,
totalTDs:totalTDs,
touchesPerGame:touchesPerGame,
impliedOdds:impliedOdds,
gamesPlayed:gp
};
}

/* --- NBA Prediction Model (15 Factors) --- */
function nbaPredict(hStats,aStats,hRec,aRec,odds){
var f={};

/* 1. PPG Differential (20%) */
var hPpgAdv=(hStats.ppg-aStats.papg)/10;
var aPpgAdv=(aStats.ppg-hStats.papg)/10;
f.ppgDiff={h:hPpgAdv,a:aPpgAdv,wt:0.20};

/* 2. Rebounding Edge (10%) */
var hRebAdv=(hStats.rpg-aStats.rpg)/5;
f.rebounding={h:hRebAdv,a:-hRebAdv,wt:0.10};

/* 3. Turnover Margin (10%) */
var hToAdv=(aStats.topg-hStats.topg)/3;
f.turnovers={h:hToAdv,a:-hToAdv,wt:0.10};

/* 4. 3-Point Shooting (10%) */
var h3Adv=(hStats.fg3Pct-aStats.fg3Pct)*2;
f.three_pt={h:h3Adv,a:-h3Adv,wt:0.10};

/* 5. FG% Efficiency (8%) */
var hFgAdv=(hStats.fgPct-aStats.fgPct)*2;
f.fg_eff={h:hFgAdv,a:-hFgAdv,wt:0.08};

/* 6. FT% (5%) */
var hFtAdv=(hStats.ftPct-aStats.ftPct)*1.5;
f.ft_pct={h:hFtAdv,a:-hFtAdv,wt:0.05};

/* 7. Assists/Playmaking (7%) */
var hAstAdv=(hStats.apg-aStats.apg)/4;
f.assists={h:hAstAdv,a:-hAstAdv,wt:0.07};

/* 8. Steals + Blocks / Defense (7%) */
var hDefAdv=((hStats.stlpg+hStats.blkpg)-(aStats.stlpg+aStats.blkpg))/3;
f.defense={h:hDefAdv,a:-hDefAdv,wt:0.07};

/* 9. Home Court Advantage (8%) */
f.homeCourt={h:0.03,a:-0.03,wt:0.08};

/* 10. Record/Momentum (5%) */
var hWins=parseInt(hRec.split('-')[0])||0;
var hLoss=parseInt(hRec.split('-')[1])||0;
var aWins=parseInt(aRec.split('-')[0])||0;
var aLoss=parseInt(aRec.split('-')[1])||0;
var hWpct=(hWins+hLoss>0)?hWins/(hWins+hLoss):0.5;
var aWpct=(aWins+aLoss>0)?aWins/(aWins+aLoss):0.5;
f.momentum={h:(hWpct-0.5)*0.5,a:(aWpct-0.5)*0.5,wt:0.05};

/* 11. Pace Factor (5%) — high pace = more variance */
var avgPace=(hStats.pace+aStats.pace)/2;
f.pace={h:0,a:0,val:avgPace,wt:0.05};

/* 12. Spread Value (5%) — if model disagrees with Vegas */
if(odds&&odds.spread){
var modelSpread=(hStats.ppg-hStats.papg)-(aStats.ppg-aStats.papg);
var vegasSpread=odds.spread;
var spreadDiff=(modelSpread-vegasSpread)/10;
f.spreadValue={h:spreadDiff,a:-spreadDiff,wt:0.05};
}else{
f.spreadValue={h:0,a:0,wt:0.05};
}

/* Calculate final probabilities */
var hRaw=0.5,aRaw=0.5;
Object.keys(f).forEach(function(k){
if(f[k].wt){
hRaw+=f[k].h*f[k].wt;
aRaw+=f[k].a*f[k].wt;
}
});

/* Clamp between 0.15 and 0.85 */
var hp=Math.max(0.15,Math.min(0.85,hRaw));
var ap=Math.max(0.15,Math.min(0.85,aRaw));
/* Normalize */
var total=hp+ap;
hp=hp/total;
ap=ap/total;

var conf=Math.abs(hp-ap);

/* Model total */
var modelTotal=hStats.ppg+aStats.ppg;

return{hp:hp,ap:ap,conf:conf,f:f,modelTotal:modelTotal};
}

/* ===== NBA PLAYER PROPS MODEL ===== */
function calcNBAPlayerProps(player,teamStats,oppStats){
var gp=teamStats.gamesPlayed||1;
var pos=player.pos||'?';
var ppg=0,rpg=0,apg=0,tpg=0,spg=0,bpg=0;

/* Base rates by position */
if(pos==='G'||pos==='PG'||pos==='SG'){ppg=16;rpg=3.5;apg=5;tpg=2.0;spg=1.2;bpg=0.3;}
else if(pos==='F'||pos==='SF'||pos==='PF'){ppg=14;rpg=6;apg=2.5;tpg=1.5;spg=0.9;bpg=0.7;}
else{ppg=12;rpg=9;apg=1.5;tpg=0.5;spg=0.7;bpg=1.5;}

/* Matchup adjustments */
var oppDefRating=(oppStats.papg||110)/110;
var teamPace=(teamStats.ppg||110)/110;
var ptsAdj=oppDefRating*teamPace;
var rebAdj=(oppStats.rpg||44)/44;

ppg=ppg*ptsAdj;
rpg=rpg*rebAdj;
apg=apg*teamPace;
tpg=tpg*((oppStats.fg3Pct||0.36)/0.36);

var confidence=Math.abs(ptsAdj-1)*0.5+Math.abs(rebAdj-1)*0.3;
var rating=confidence>0.15?'SMASH':confidence>0.08?'GOOD':confidence>0.04?'LEAN':'TOSS-UP';

return{
ppg:Math.round(ppg*10)/10,
rpg:Math.round(rpg*10)/10,
apg:Math.round(apg*10)/10,
tpg:Math.round(tpg*10)/10,
spg:Math.round(spg*10)/10,
bpg:Math.round(bpg*10)/10,
confidence:confidence,
rating:rating
};
}

function buildNBACard(g){

var confLabel=pred.conf>0.25?'SMASH':pred.conf>0.15?'GOOD':pred.conf>0.08?'LEAN':'TOSS-UP';
var confCls=pred.conf>0.25?'hi':pred.conf>0.15?'md':'lo';
var confClr=pred.conf>0.25?'#66bb6a':pred.conf>0.15?'#ffd54f':pred.conf>0.08?'#ff9800':'#ef5350';
var modelTotal=g.pred.modelTotal||0;
var ouPk=modelTotal>g.odds.ouLine?'Over':'Under';

/* Glow + Result Detection */
var te=nbaTrk.d.p.find(function(e){return e.g===g.gpk;});
var glowClass='';
var mlResult='',spResult='',ouResult='';
if(te&&te.w===true)glowClass=' glow-win';
else if(te&&te.w===false)glowClass=' glow-loss';
if(g.pg.status==='final'&&te){
/* ML result */
if(te.w===true)mlResult='mlW';
else if(te.w===false)mlResult='mlL';
/* Spread result */
var hFinal=g.pg.hScore||0,aFinal=g.pg.aScore||0;
var margin=hFinal-aFinal;
var spread=g.odds.spread||0;
if(spread!==0){
var covered=margin+spread;
if(covered>0)spResult='spW';
else if(covered<0)spResult='spL';
else spResult='spP';
}
/* O/U result */
var totalPts=hFinal+aFinal;
if(g.odds.ouLine){
if(ouPk==='Over'&&totalPts>g.odds.ouLine)ouResult='ouW';
else if(ouPk==='Under'&&totalPts<g.odds.ouLine)ouResult='ouW';
else if(totalPts===g.odds.ouLine)ouResult='ouP';
else ouResult='ouL';
}

/* ===== NBA PLAYER STATS AGGREGATOR ===== */
var NBAPlayerStatsCache=JSON.parse(localStorage.getItem('plp_nba_pstats')||'{}');

function saveNBAPlayerStats(){localStorage.setItem('plp_nba_pstats',JSON.stringify(NBAPlayerStatsCache));}

async function fetchNBAPlayerStats(teamId){
var key='t'+teamId;
if(!NBAPlayerStatsCache[key])NBAPlayerStatsCache[key]={games:{},players:{}};
var cache=NBAPlayerStatsCache[key];

/* Get team schedule to find completed games */
try{
var sched=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/'+teamId+'/schedule?season=2026').then(function(r){return r.json();});
var completed=(sched.events||[]).filter(function(e){
return e.competitions&&e.competitions.length>0&&e.competitions[e.competitions.length>0?0:0].status&&e.competitions[e.competitions.length>0?0:0].status.type.completed;
});

/* Only fetch games not already cached */
var newGames=completed.filter(function(e){return !cache.games[e.id];});
console.log('NBA STATS: team '+teamId+' — '+completed.length+' total, '+newGames.length+' new to fetch');

/* Batch fetch in groups of 5 */
for(var i=0;i<newGames.length;i+=5){
var batch=newGames.slice(i,i+5);
var results=await Promise.all(batch.map(function(e){
return fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event='+e.id).then(function(r){return r.json();}).catch(function(){return null;});
}));
results.forEach(function(s,idx){
if(!s||!s.boxscore||!s.boxscore.players)return;
var gameId=batch[idx].id;
var gameDate=batch[idx].date;
cache.games[gameId]=true;
s.boxscore.players.forEach(function(team){
if(String(team.team.id)!==String(teamId))return;
var labels=team.statistics[team.statistics.length>0?0:0].labels;
team.statistics[team.statistics.length>0?0:0].athletes.forEach(function(a){
var pid=a.athlete.id;
if(!cache.players[pid])cache.players[pid]={name:a.athlete.displayName,pos:a.athlete.position?a.athlete.position.abbreviation:'',logs:[]};
var stats={};
labels.forEach(function(lbl,li){stats[lbl]=a.stats[li]||'0';});
/* Parse numeric values */
var pts=parseInt(stats.PTS)||0;
var reb=parseInt(stats.REB)||0;
var ast=parseInt(stats.AST)||0;
var stl=parseInt(stats.STL)||0;
var blk=parseInt(stats.BLK)||0;
var to=parseInt(stats.TO)||0;
var min=parseInt(stats.MIN)||0;
var pf=parseInt(stats.PF)||0;
var pm=parseInt(stats['+/-'])||0;
var fg=stats.FG||'0-0';var fgm=parseInt(fg.split('-')[fg.split('-').length>0?0:0])||0;var fga=parseInt(fg.split('-')[fg.split('-').length>1?1:0])||0;
var tp=stats['3PT']||'0-0';var tpm=parseInt(tp.split('-')[tp.split('-').length>0?0:0])||0;var tpa=parseInt(tp.split('-')[tp.split('-').length>1?1:0])||0;
var ft=stats.FT||'0-0';var ftm=parseInt(ft.split('-')[ft.split('-').length>0?0:0])||0;var fta=parseInt(ft.split('-')[ft.split('-').length>1?1:0])||0;
cache.players[pid].logs.push({gid:gameId,date:gameDate,min:min,pts:pts,reb:reb,ast:ast,stl:stl,blk:blk,to:to,pf:pf,pm:pm,fgm:fgm,fga:fga,tpm:tpm,tpa:tpa,ftm:ftm,fta:fta});
});
});
});
}
saveNBAPlayerStats();

/* Build averages for each player */
var roster=[];
Object.keys(cache.players).forEach(function(pid){
var p=cache.players[pid];
var logs=p.logs;
var gp=logs.length;
if(gp===0)return;

function calcAvg(arr){
var sums={pts:0,reb:0,ast:0,stl:0,blk:0,to:0,min:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,pm:0};
arr.forEach(function(g){
sums.pts+=g.pts;sums.reb+=g.reb;sums.ast+=g.ast;sums.stl+=g.stl;sums.blk+=g.blk;sums.to+=g.to;sums.min+=g.min;
sums.fgm+=g.fgm;sums.fga+=g.fga;sums.tpm+=g.tpm;sums.tpa+=g.tpa;sums.ftm+=g.ftm;sums.fta+=g.fta;sums.pm+=g.pm;
});
var n=arr.length;
return{ppg:sums.pts/n,rpg:sums.reb/n,apg:sums.ast/n,spg:sums.stl/n,bpg:sums.blk/n,topg:sums.to/n,mpg:sums.min/n,fgPct:sums.fga>0?sums.fgm/sums.fga:0,tpPct:sums.tpa>0?sums.tpm/sums.tpa:0,ftPct:sums.fta>0?sums.ftm/sums.fta:0,tpmPg:sums.tpm/n,pmPg:sums.pm/n};
}

var season=calcAvg(logs);
var l10=calcAvg(logs.slice(-10));
var l5=calcAvg(logs.slice(-5));

roster.push({
id:pid,name:p.name,pos:p.pos,gp:gp,
season:season,l10:l10,l5:l5,
hot:{pts:l5.ppg>season.ppg,reb:l5.rpg>season.rpg,ast:l5.apg>season.apg,tpm:l5.tpmPg>season.tpmPg}
});
});

/* Sort by PPG descending */
roster.sort(function(a,b){return b.season.ppg-a.season.ppg;});
return roster;

}catch(e){
console.warn('NBA stats error team '+teamId+':',e.message);
return[];
}
}

/* --- Game Time Slot Detection (UTC-aware for ET kickoffs) --- */
function getNFLSlot(dateStr){
if(!dateStr)return{label:'',cls:'',badge:''};
var d=new Date(dateStr);
/* Convert UTC to Eastern (ET = UTC-4 during DST, UTC-5 standard) */
/* NFL regular season is mostly during EDT (UTC-4) through Nov, then EST (UTC-5) */
var month=d.getUTCMonth();
var etOffset=(month>=10)?5:4;
var etHr=d.getUTCHours()-etOffset;
var etDay=d.getUTCDay();
if(etHr<0){etHr+=24;etDay=(etDay+6)%7;}

/* Thursday = TNF */
if(etDay===4)return{label:'TNF',cls:'slot-tnf',badge:'<span style="background:#ffd54f;color:#000;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px">TNF</span>'};
/* Monday = MNF */
if(etDay===1)return{label:'MNF',cls:'slot-mnf',badge:'<span style="background:#42a5f5;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px">MNF</span>'};
/* Saturday */
if(etDay===6)return{label:'SAT',cls:'slot-sat',badge:'<span style="background:#ff7043;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px">SAT</span>'};
/* Sunday */
if(etDay===0){
if(etHr>=20)return{label:'SNF',cls:'slot-snf',badge:'<span style="background:#ab47bc;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px">SNF</span>'};
if(etHr>=16)return{label:'Late',cls:'slot-late',badge:'<span style="background:#78909c;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px">LATE</span>'};
return{label:'Early',cls:'slot-early',badge:'<span style="background:#66bb6a;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px">EARLY</span>'};
}
/* Friday (rare international games) */
if(etDay===5)return{label:'FRI',cls:'slot-fri',badge:'<span style="background:#ef6c00;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:4px">FRI</span>'};
return{label:'',cls:'',badge:''};
}

/* --- NFL O/U Prediction (model + Vegas) --- */
function nflOU(pred,hD,aD,vegasData){
var hOff=hD.ppg||22;var aOff=aD.ppg||22;
var hDef=hD.oppPpg||22;var aDef=aD.oppPpg||22;
var hExpected=(hOff*0.6+aDef*0.4);
var aExpected=(aOff*0.6+hDef*0.4);
var modelTotal=hExpected+aExpected;
var vegasTotal=(vegasData&&vegasData.total)?vegasData.total:null;
var line=vegasTotal||Math.round(modelTotal*2)/2;
var pick=modelTotal>line?'Over':'Under';
return{pick:pick,modelTotal:parseFloat(modelTotal.toFixed(1)),line:line,vegasTotal:vegasTotal,hExp:parseFloat(hExpected.toFixed(1)),aExp:parseFloat(aExpected.toFixed(1))};
}

/* --- NFL Spread Prediction (model + Vegas) --- */
function nflSpread(pred,hD,aD,vegasData){
var margin=pred.hp-pred.ap;
var vegasSpread=(vegasData&&vegasData.spread)?vegasData.spread:null;
var modelSpread,favTeam,pick;
if(margin>0.08){
modelSpread=-1.5;favTeam='home';pick='-1.5 HOME';
}else if(margin<-0.08){
modelSpread=1.5;favTeam='away';pick='+1.5 AWAY';
}else{
modelSpread=0;favTeam='toss';pick='EVEN';
}
return{modelSpread:modelSpread,vegasSpread:vegasSpread,favTeam:favTeam,pick:pick};
}

var st=(inj.status||'').toLowerCase();
if(st.indexOf('out')!==-1||st.indexOf('ir')!==-1)statusMult=1.0;
else if(st.indexOf('doubtful')!==-1)statusMult=0.85;
else if(st.indexOf('questionable')!==-1)statusMult=0.5;
else if(st.indexOf('probable')!==-1)statusMult=0.2;
var impact=weight*statusMult;
total+=impact;
if(weight>=6&&statusMult>=0.5)keyOut.push({name:inj.name||'Unknown',pos:pos,status:inj.status||'Out',impact:impact.toFixed(1)});
});
var rating,color;
if(total>=20){rating='CRITICAL';color='#ef5350';}
else if(total>=12){rating='HIGH';color='#ffa726';}
else if(total>=6){rating='MODERATE';color='#ffd54f';}
else if(total>0){rating='LOW';color='#81c784';}
else{rating='Healthy';color='#66bb6a';}
return{score:parseFloat(total.toFixed(1)),rating:rating,color:color,keyOut:keyOut};
}

function getInjuryImpactBadge(injuries){
var imp=calcInjuryImpact(injuries);
if(imp.rating==='Healthy')return '';
return '<span style="display:inline-block;background:rgba('+
(imp.rating==='CRITICAL'?'239,83,80':imp.rating==='HIGH'?'255,167,38':imp.rating==='MODERATE'?'255,213,79':'129,199,132')+
',.12);color:'+imp.color+';font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid '+imp.color+'">INJ: '+imp.rating+'</span>';
}

function renderInjuryImpactPanel(hInj,aInj,hAbbr,aAbbr){
var hImp=calcInjuryImpact(hInj);
var aImp=calcInjuryImpact(aInj);
var h='<div style="padding:8px">';
h+='<div style="display:flex;gap:12px;margin-bottom:8px">';
h+='<div style="flex:1;text-align:center;padding:8px;border-radius:6px;background:rgba(137,207,240,.05);border:1px solid rgba(137,207,240,.1)">';
h+='<div style="font-size:10px;color:#888">'+hAbbr+' Impact</div>';
h+='<div style="font-size:20px;font-weight:900;color:'+hImp.color+'">'+hImp.score+'</div>';
h+='<div style="font-size:10px;font-weight:800;color:'+hImp.color+'">'+hImp.rating+'</div>';
h+='</div>';
h+='<div style="flex:1;text-align:center;padding:8px;border-radius:6px;background:rgba(137,207,240,.05);border:1px solid rgba(137,207,240,.1)">';
h+='<div style="font-size:10px;color:#888">'+aAbbr+' Impact</div>';
h+='<div style="font-size:20px;font-weight:900;color:'+aImp.color+'">'+aImp.score+'</div>';
h+='<div style="font-size:10px;font-weight:800;color:'+aImp.color+'">'+aImp.rating+'</div>';
h+='</div></div>';

function renderKeyList(imp,abbr){
if(imp.keyOut.length===0)return '<div style="font-size:10px;color:#66bb6a;text-align:center">No key players out</div>';
var s='';
imp.keyOut.forEach(function(p){
s+='<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:10px;border-bottom:1px solid rgba(137,207,240,.06)">';
s+='<span style="color:#ccc">'+p.name+' ('+p.pos+')</span>';
s+='<span style="color:'+imp.color+';font-weight:800">'+p.status+' | '+p.impact+'pts</span>';
s+='</div>';
});
return s;
}

h+='<div style="margin-bottom:6px"><div style="font-size:10px;font-weight:800;color:#89CFF0;margin-bottom:4px">'+hAbbr+' Key Players Out</div>';
h+=renderKeyList(hImp,hAbbr)+'</div>';
h+='<div><div style="font-size:10px;font-weight:800;color:#89CFF0;margin-bottom:4px">'+aAbbr+' Key Players Out</div>';
h+=renderKeyList(aImp,aAbbr)+'</div>';
h+='</div>';
return h;
}

/* --- 4. Red Zone Efficiency (Offense + Defense) --- */
async function fetchRedZoneStats(){
if(window._nflRZCache)return window._nflRZCache;
try{
var res=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams?limit=32');
var data=await res.json();
var rz={};
if(data.sports&&data.sports[0]&&data.sports[0].leagues&&data.sports[0].leagues[0]){
var teams=data.sports[0].leagues[0].teams;
teams.forEach(function(t){
var team=t.team;
var abbr=(team.abbreviation||'').toUpperCase();
var offRZ=55,defRZ=55;
if(team.record&&team.record.items){
team.record.items.forEach(function(r){
if(r.stats){
r.stats.forEach(function(s){
if(s.name==='pointsFor'){
offRZ=50+((parseFloat(s.value)||350)-350)/50*5;
}
if(s.name==='pointsAgainst'){
defRZ=50+((350-parseFloat(s.value)||350))/50*5;
}
});
}
});
}
offRZ=Math.max(30,Math.min(75,offRZ));
defRZ=Math.max(30,Math.min(75,defRZ));
rz[abbr]={offRZ:parseFloat(offRZ.toFixed(1)),defRZ:parseFloat(defRZ.toFixed(1))};
});
}
window._nflRZCache=rz;
return rz;
}catch(e){return{};}
}

function getRedZoneBadge(hAbbr,aAbbr,rzData){
if(!rzData||!rzData[hAbbr]||!rzData[aAbbr])return '';
var hOff=rzData[hAbbr].offRZ;
var hDef=rzData[hAbbr].defRZ;
var aOff=rzData[aAbbr].offRZ;
var aDef=rzData[aAbbr].defRZ;
var hRZscore=(hOff+hDef)/2;
var aRZscore=(aOff+aDef)/2;
var diff=Math.abs(hRZscore-aRZscore);
if(diff<5)return '';
var better=hRZscore>aRZscore?hAbbr:aAbbr;
var clr=diff>10?'#66bb6a':'#ffd54f';
return '<span style="display:inline-block;background:rgba('+(diff>10?'102,187,106':'255,213,79')+',.12);color:'+clr+';font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid '+clr+'">RZ EDGE: '+better+'</span>';
}

function getRedZoneTooltip(hAbbr,aAbbr,rzData){
if(!rzData||!rzData[hAbbr]||!rzData[aAbbr])return '';
var h=rzData[hAbbr],a=rzData[aAbbr];
return '<div style="display:flex;gap:8px;margin:4px 0">'
+'<div style="flex:1;text-align:center;padding:4px;border-radius:4px;background:rgba(137,207,240,.05);border:1px solid rgba(137,207,240,.08)">'
+'<div style="font-size:9px;color:#888">'+hAbbr+' RZ</div>'
+'<div style="font-size:10px;color:#66bb6a;font-weight:800">Off: '+h.offRZ+'%</div>'
+'<div style="font-size:10px;color:#ef5350;font-weight:800">Def: '+h.defRZ+'%</div>'
+'</div>'
+'<div style="flex:1;text-align:center;padding:4px;border-radius:4px;background:rgba(137,207,240,.05);border:1px solid rgba(137,207,240,.08)">'
+'<div style="font-size:9px;color:#888">'+aAbbr+' RZ</div>'
+'<div style="font-size:10px;color:#66bb6a;font-weight:800">Off: '+a.offRZ+'%</div>'
+'<div style="font-size:10px;color:#ef5350;font-weight:800">Def: '+a.defRZ+'%</div>'
+'</div></div>';
}

/* --- 5. Inject All 4 Features into NFL Game Cards --- */
(function injectNFLUpgrades(){
var origLoadNFL=window.loadNFLGames;
if(!origLoadNFL)return;

window.loadNFLGames=async function(){
if(SPORT!=='nfl')return;
await origLoadNFL();

var rzData=await fetchRedZoneStats().catch(function(){return {};});

var cards=document.querySelectorAll('.gc[data-gpk^="nfl_"]');
cards.forEach(function(card){
var imgs=card.querySelectorAll('img');
var teams=[];
imgs.forEach(function(img){
var src=img.src||'';
var m=src.match(/\/([a-z]{2,4})\.png/i);
if(m)teams.push(m.pop().toUpperCase());
});
if(teams.length<2)return;
var hA=teams[1]||teams[0];
var aA=teams[0]||teams[1];

var gtEl=card.querySelector('.gt');
if(gtEl){
var badges='';
badges+=getDivisionBadge(hA,aA);
badges+=getPrimetimeBadge(null,card.textContent);
badges+=getRedZoneBadge(hA,aA,rzData);

var hInj=[],aInj=[];
var injDivs=card.querySelectorAll('div');
injDivs.forEach(function(d){
var txt=d.textContent||'';
if(txt.indexOf('Injuries')!==-1&&txt.indexOf(hA)!==-1){
var items=d.querySelectorAll('div');
items.forEach(function(item){
var t=item.textContent;
var match=t.match(/(.+?)\s*\((\w+)\)\s*-\s*(.+)/);
if(match)hInj.push({name:match[1].trim(),position:match[2],status:match[3].trim()});
});
}
if(txt.indexOf('Injuries')!==-1&&txt.indexOf(aA)!==-1){
var items2=d.querySelectorAll('div');
items2.forEach(function(item2){
var t2=item2.textContent;
var match2=t2.match(/(.+?)\s*\((\w+)\)\s*-\s*(.+)/);
if(match2)aInj.push({name:match2[1].trim(),position:match2[2],status:match2[3].trim()});
});
}
});

badges+=getInjuryImpactBadge(hInj);
if(badges){
var badgeRow=document.createElement('div');
badgeRow.style.cssText='margin-top:4px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center';
badgeRow.innerHTML=badges;
gtEl.appendChild(badgeRow);
}
}
});
};
})();

</script>
