var total=0;
Object.keys(f).forEach(function(k){total+=f[k];});
var hp=1/(1+Math.pow(10,-total));
var ap=1-hp;

/* --- YRFI/NRFI Model (NRFI-biased) --- */
function predictYRFI(hSP,aSP,hD,aD,hId,vegasData){
var nrfiBase=0.58;
var yrfiProb=1-nrfiBase;
if(hSP&&hSP.era){
var hSpEra=hSP.era;
if(hSpEra<3.0)yrfiProb-=0.08;
else if(hSpEra<3.5)yrfiProb-=0.05;
else if(hSpEra>5.0)yrfiProb+=0.08;
else if(hSpEra>4.5)yrfiProb+=0.04;
if(hSP.whip&&hSP.whip<1.1)yrfiProb-=0.04;
else if(hSP.whip&&hSP.whip>1.4)yrfiProb+=0.04;
if(hSP.k9&&hSP.k9>10)yrfiProb-=0.03;
else if(hSP.k9&&hSP.k9<6)yrfiProb+=0.03;
if(hSP.bb9&&hSP.bb9>4)yrfiProb+=0.03;
else if(hSP.bb9&&hSP.bb9<2.5)yrfiProb-=0.02;
}
if(aSP&&aSP.era){
var aSpEra=aSP.era;
if(aSpEra<3.0)yrfiProb-=0.08;
else if(aSpEra<3.5)yrfiProb-=0.05;
else if(aSpEra>5.0)yrfiProb+=0.08;
else if(aSpEra>4.5)yrfiProb+=0.04;
if(aSP.whip&&aSP.whip<1.1)yrfiProb-=0.04;
else if(aSP.whip&&aSP.whip>1.4)yrfiProb+=0.04;
if(aSP.k9&&aSP.k9>10)yrfiProb-=0.03;
else if(aSP.k9&&aSP.k9<6)yrfiProb+=0.03;
if(aSP.bb9&&aSP.bb9>4)yrfiProb+=0.03;
else if(aSP.bb9&&aSP.bb9<2.5)yrfiProb-=0.02;
}
var hOps=hD.hit?hD.hit.ops||0.720:0.720;
var aOps=aD.hit?aD.hit.ops||0.720:0.720;
if(hOps>0.780)yrfiProb+=0.03;
else if(hOps<0.680)yrfiProb-=0.03;
if(aOps>0.780)yrfiProb+=0.03;
else if(aOps<0.680)yrfiProb-=0.03;
var pf=(T[hId]?T[hId].pf:100);
if(pf>105)yrfiProb+=0.02;
else if(pf<95)yrfiProb-=0.02;
yrfiProb=Math.max(0.15,Math.min(0.75,yrfiProb));
var pick=yrfiProb>0.52?'YRFI':'NRFI';
var conf=pick==='YRFI'?yrfiProb:(1-yrfiProb);
return{pick:pick,prob:conf,conf:Math.abs(conf-0.5)*2,yrfiProb:yrfiProb,nrfiProb:1-yrfiProb};
}

/* --- Vegas-Anchored O/U + Bet Lines --- */
function betLines(pred,hD,aD,hId,aId,hSP,aSP,vegasData){
var vegasTotal=(vegasData&&vegasData.total)?vegasData.total:8.5;
var adj=0;
var avgSpEra=((hSP?hSP.era:4.5)+(aSP?aSP.era:4.5))/2;
adj+=(avgSpEra-4.0)/3*0.8;
var avgFip=((hSP?hSP.fip:4.2)+(aSP?aSP.fip:4.2))/2;
adj+=(avgFip-4.0)/3*0.5;
var avgOps=((hD.hit?hD.hit.ops:0.720)+(aD.hit?aD.hit.ops:0.720))/2;
adj+=(avgOps-0.720)/0.05*0.3;
var avgBpEra=((hD.bp?hD.bp.era:4.0)+(aD.bp?aD.bp.era:4.0))/2;
adj+=(avgBpEra-3.8)/2*0.4;
var pf=(T[hId]?T[hId].pf:100);
adj+=(pf-100)/10*0.3;
if(vegasData&&vegasData.wx&&!DOME[hId]){
var temp=vegasData.wx?vegasData.wx.temperature:72;
adj+=(temp-72)/30*0.2;
}
var avgK9=((hSP?hSP.k9:8.5)+(aSP?aSP.k9:8.5))/2;
adj+=(8.5-avgK9)/3*0.3;
var avgBb9=((hSP?hSP.bb9:3.0)+(aSP?aSP.bb9:3.0))/2;
adj+=(avgBb9-3.0)/2*0.2;
var modelTotal=vegasTotal+adj;
var blended=(modelTotal*0.35)+(vegasTotal*0.65);
var ouPk;
var ouDiff=blended-vegasTotal;
if(Math.abs(ouDiff)<0.3){ouPk=blended>=vegasTotal?'Over':'Under';}
else{ouPk=blended>vegasTotal?'Over':'Under';}

/* --- O/U using v7.3 formula --- */
var hEraOU=aSP?aSP.era:4.5;
var aEraOU=hSP?hSP.era:4.5;
var hOpsOU=hD.hit?hD.hit.ops||0.720:0.720;
var aOpsOU=aD.hit?aD.hit.ops||0.720:0.720;
var hRunsOU=hEraOU*0.6+(hOpsOU/0.72)*3.2*0.4;
var aRunsOU=aEraOU*0.6+(aOpsOU/0.72)*3.2*0.4;
var pfOU=(T[hId]?T[hId].pf:100);
if(pfOU>105){hRunsOU*=1.04;aRunsOU*=1.04;}
if(pfOU<95){hRunsOU*=0.97;aRunsOU*=0.97;}
var ouModelTotal=hRunsOU+aRunsOU;
var ouLine=vegasTotal||Math.round(ouModelTotal*2)/2;
ouPk=ouModelTotal>ouLine?'Over':'Under';
var hShare=pred.hp/(pred.hp+pred.ap);
var rawH=ouModelTotal*hShare;
var rawA=ouModelTotal*(1-hShare);
var hSc=Math.round(rawH);
var aSc=Math.round(rawA);
if(hSc<0)hSc=0;
if(aSc<0)aSc=0;
if(hSc+aSc>ouLine&&ouPk==='Under'){
var diff=Math.ceil((hSc+aSc)-ouLine);
if(hSc>=aSc)aSc=Math.max(0,aSc-diff);
else hSc=Math.max(0,hSc-diff);
}
if(hSc+aSc<ouLine&&ouPk==='Over'){
var diff2=Math.ceil(ouLine-(hSc+aSc));
if(hSc>=aSc)hSc+=diff2;
else aSc+=diff2;
}
if(hSc===aSc){if(pred.hp>=pred.ap)hSc+=1;else aSc+=1;}

/* --- SPREAD derived from predicted score --- */
var margin=hSc-aSc;
var favTeam=pred.hp>=pred.ap?(T[hId]?T[hId].a:'HOME'):(T[aId]?T[aId].a:'AWAY');
var dogTeam=pred.hp<pred.ap?(T[hId]?T[hId].a:'HOME'):(T[aId]?T[aId].a:'AWAY');
var spread,spFav,spTxt;
if(Math.abs(margin)>=2){
spread=-1.5;
spFav=favTeam;
spTxt='-1.5 '+favTeam;
}else{
spread=1.5;
spFav=dogTeam;
spTxt='+1.5 '+dogTeam;
}

/* --- Money Lines --- */
var hML,aML;
if(pred.hp>0.5){hML=Math.round(-pred.hp/(1-pred.hp)*100);aML=Math.round((1-pred.hp)/pred.hp*100);}
else{hML=Math.round((1-pred.ap)/pred.ap*100);aML=Math.round(-pred.ap/(1-pred.ap)*100);}
return{hSc:hSc,aSc:aSc,spread:spread,spFav:spFav,spTxt:spTxt,hML:hML,aML:aML,ouLine:vegasTotal,ouPk:ouPk,modelTotal:modelTotal};
}

var d=await gfetch(ESPN_BASE+'/teams/'+teamId+'/statistics?season=2026');
var stats={ppg:22,papg:22,ypg:340,yapg:340,rushYpg:120,passYpg:220,turnovers:15,thirdPct:40,rzPct:55,sacks:30,penYpg:50,streak:0,pdiff:0,dvoa:0,sos:0.5,rest:7,w:0,l:0};
if(d&&d.results&&d.results.stats){
var cats=d.results.stats.categories||[];
cats.forEach(function(cat){
(cat.stats||[]).forEach(function(s){
if(s.name==='totalPointsPerGame')stats.ppg=parseFloat(s.value)||22;
if(s.name==='totalYardsPerGame')stats.ypg=parseFloat(s.value)||340;
if(s.name==='rushingYardsPerGame')stats.rushYpg=parseFloat(s.value)||120;
if(s.name==='netPassingYardsPerGame')stats.passYpg=parseFloat(s.value)||220;
});
});
}
return stats;
}catch(e){return{ppg:22,papg:22,ypg:340,yapg:340,rushYpg:120,passYpg:220,turnovers:15,thirdPct:40,rzPct:55,sacks:30,penYpg:50,streak:0,pdiff:0,dvoa:0,sos:0.5,rest:7,w:0,l:0};}
}

async function getNFLVegasOdds(){
try{
var d=await gfetch(ODDS_BASE+'/americanfootball_nfl/odds/?apiKey='+ODDS_KEY+'&regions=us&markets=h2h,spreads,totals&bookmakers=draftkings,fanduel');
var map={};
if(!d||!Array.isArray(d))return map;
d.forEach(function(ev){
var key=(ev.home_team||'')+'|'+(ev.away_team||'');
var odds={dk:{},fd:{}};
(ev.bookmakers||[]).forEach(function(bk){
var bkKey=bk.key==='draftkings'?'dk':'fd';
(bk.markets||[]).forEach(function(mk){
if(mk.key==='h2h'){
(mk.outcomes||[]).forEach(function(o){
if(o.name===ev.home_team)odds[bkKey].hML=o.price;
if(o.name===ev.away_team)odds[bkKey].aML=o.price;
});
}
if(mk.key==='spreads'){
(mk.outcomes||[]).forEach(function(o){
if(o.name===ev.home_team)odds[bkKey].hSpread=o.point;
});
}
if(mk.key==='totals'){
(mk.outcomes||[]).forEach(function(o){
if(o.name==='Over')odds[bkKey].total=o.point;
});
}
});
});
odds.total=odds.dk.total||odds.fd.total||null;
map[key]=odds;
});
return map;
}catch(e){return{};}
}

/* --- NFL Narrative Generator --- */
function nflGenNarrative(pred,bl,hI,aI,hD,aD){
var hA=hI.a,aA=aI.a;
var pick=pred.hp>=0.5?hA:aA;
var confLvl=pred.conf>0.3?'high':(pred.conf>0.15?'moderate':'low');
var n='PLP projects <strong>'+pick+'</strong> to win with '+confLvl+' confidence. ';
n+='Score prediction: <strong>'+hA+' '+bl.hSc+' - '+aA+' '+bl.aSc+'</strong>. ';
n+='O/U: '+bl.ouPk+' '+bl.ouLine+' (model: '+bl.modelTotal+'). ';
var offAdv=hD.ppg>aD.ppg?hA:aA;
n+=offAdv+' has the offensive edge ('+Math.max(hD.ppg,aD.ppg).toFixed(1)+' PPG). ';
if(Math.abs(bl.spread)>=7)n+='This is a significant mismatch. ';
return n;
}

/* --- Countdown to First Pitch --- */
function getCountdown(gameDate){
if(!gameDate)return'';
var now=new Date();
var gd=new Date(gameDate);
var diff=gd-now;
if(diff<=0)return'';
var hrs=Math.floor(diff/3600000);
var mins=Math.floor((diff%3600000)/60000);
if(hrs>24)return'';
return hrs+'h '+mins+'m to first pitch';
}

function renderMismatchChart(hSP,aSP,hTeam,aTeam){
if(!hSP&&!aSP)return'<div style="color:#888;font-size:10px;padding:4px">Starting pitcher data not available</div>';
var hE=hSP?hSP.era:4.50,aE=aSP?aSP.era:4.50;
var hW=hSP?hSP.whip:1.30,aW=aSP?aSP.whip:1.30;
var hK=hSP?hSP.k9:7.0,aK=aSP?aSP.k9:7.0;
var hI=hSP?hSP.ip:80,aI=aSP?aSP.ip:80;
var hF=hSP?hSP.fip:4.50,aF=aSP?aSP.fip:4.50;
var hB=hSP?hSP.bb9:3.0,aB=aSP?aSP.bb9:3.0;
var cats=[{name:'ERA',hVal:hE,aVal:aE,lower:true,max:7},{name:'WHIP',hVal:hW,aVal:aW,lower:true,max:2},{name:'K/9',hVal:hK,aVal:aK,lower:false,max:14},{name:'IP',hVal:hI,aVal:aI,lower:false,max:200},{name:'FIP',hVal:hF,aVal:aF,lower:true,max:7},{name:'BB/9',hVal:hB,aVal:aB,lower:true,max:6}];
var hScore=0,aScore=0;
cats.forEach(function(c){if(c.lower){if(c.hVal<c.aVal)hScore++;else if(c.aVal<c.hVal)aScore++;}else{if(c.hVal>c.aVal)hScore++;else if(c.aVal>c.hVal)aScore++;}});
var edge=hScore>aScore?hTeam:(aScore>hScore?aTeam:'Even');
var edgeClr=hScore>aScore?'#66bb6a':(aScore>hScore?'#ef5350':'#ffd54f');
var h='<div style="text-align:center;margin-bottom:6px"><span style="font-size:10px;font-weight:800;color:'+edgeClr+'">Pitching Edge: '+edge+' ('+hScore+'-'+aScore+')</span></div>';

/* --- Bind Game Card Events --- */
function bindGameEvents(el){
el.querySelectorAll('[data-bet]').forEach(function(btn){
btn.addEventListener('click',function(){
var parts=this.getAttribute('data-bet').split('|');
parlayPicks.push({gpk:parts[0],type:parts[1],pick:parts[2],odds:parts[3]});
updateParlaySlip();
this.textContent='Added!';
this.disabled=true;
});
});
el.querySelectorAll('[data-toggle]').forEach(function(btn){
btn.addEventListener('click',function(){

if(tgt){
tgt.classList.toggle('open');
if(tgt.id.startsWith('lu-')&&tgt.classList.contains('open')&&tgt.querySelector('.ld')){
var gpk=tgt.id.replace('lu-','');
fetchLineup(gpk).then(function(lu){
var hEl=document.getElementById('lu-h-'+gpk);

if(aEl)aEl.innerHTML=renderLineupTable(lu.away);
});
}
if(tgt.id.startsWith('bvp-')&&tgt.classList.contains('open')&&tgt.querySelector('.ld')){
var gpk=tgt.id.replace('bvp-','');
fetchLineup(gpk).then(function(lu){
var hEl=document.getElementById('bvp-h-'+gpk);
var aEl=document.getElementById('bvp-a-'+gpk);
if(hEl)hEl.innerHTML=renderBvP(lu.home,'Opposing SP');
if(aEl)aEl.innerHTML=renderBvP(lu.away,'Opposing SP');
});
}
if(tgt.id.startsWith('bp-')&&tgt.classList.contains('open')&&tgt.querySelector('.ld')){
var gpk=tgt.id.replace('bp-','');
fetchLineup(gpk).then(function(lu){
var hEl=document.getElementById('bp-h-'+gpk);
var aEl=document.getElementById('bp-a-'+gpk);
if(hEl)hEl.innerHTML=renderBatterProps(lu.home);
if(aEl)aEl.innerHTML=renderBatterProps(lu.away);
});
}
}
});
});
el.querySelectorAll('[data-fav-gpk]').forEach(function(btn){
btn.addEventListener('click',function(){
var gpk=this.getAttribute('data-fav-gpk');
Favs.toggle(gpk);
this.classList.toggle('on');
this.innerHTML=Favs.has(gpk)?'&#9733;':'&#9734;';
});
});

el.querySelectorAll('[data-note-gpk]').forEach(function(ta){
ta.addEventListener('input',function(){
GameNotes.set(this.getAttribute('data-note-gpk'),this.value);
});
});
el.querySelectorAll('.sort-btn').forEach(function(btn){
btn.addEventListener('click',function(){
var wasActive=this.classList.contains('active');
el.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active');});
if(wasActive){if(SPORT==='mlb')loadGames();else loadNFLGames();return;}
this.classList.add('active');
var sort=this.getAttribute('data-sort');
var cards=Array.from(el.querySelectorAll('.gc'));
cards.sort(function(a,b){
if(sort==='conf')return parseFloat(b.getAttribute('data-conf'))-parseFloat(a.getAttribute('data-conf'));
if(sort==='fav'){var aFav=parseInt(a.getAttribute('data-fav'))||0;var bFav=parseInt(b.getAttribute('data-fav'))||0;if(aFav===0)a.style.display='none';else a.style.display='';if(bFav===0)b.style.display='none';else b.style.display='';return bFav-aFav;}
if(sort==='time'){Array.from(el.querySelectorAll('.gc')).forEach(function(c){c.style.display='';});return 0;}
});
var sortBar=el.querySelector('.sort-bar');
cards.forEach(function(c){el.appendChild(c);});
if(sortBar)el.insertBefore(sortBar,el.firstChild);
});
});
}

/* --- Parlay Slip --- */
function updateParlaySlip(){
var slip=document.getElementById('parlay-slip');
var countEl=document.getElementById('ps-count');
var picksEl=document.getElementById('ps-picks');
var payoutEl=document.getElementById('ps-payout');
if(parlayPicks.length===0){slip.classList.remove('on');return;}
slip.classList.add('on');
countEl.textContent='('+parlayPicks.length+')';
var h='';
parlayPicks.forEach(function(p,idx){
h+='<div class="ps-leg"><span style="flex:1;font-size:10px">'+p.type+': '+p.pick+'</span>';
h+='<input class="ps-odds-input" value="'+(p.odds||'-110')+'" data-leg-idx="'+idx+'">';
h+='<button class="xb" data-rm-leg="'+idx+'" style="margin-left:4px;color:#ef5350">X</button></div>';
});
picksEl.innerHTML=h;
var combinedOdds=1;
parlayPicks.forEach(function(p){
var o=parseInt(p.odds)||(-110);
var dec=o>0?(o/100+1):(100/Math.abs(o)+1);
combinedOdds*=dec;
});
var americanOdds=combinedOdds>=2?Math.round((combinedOdds-1)*100):Math.round(-100/(combinedOdds-1));
var payout=(Bank.d.unit*combinedOdds).toFixed(2);
payoutEl.style.display='block';
payoutEl.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid rgba(137,207,240,.1)"><div><span style="font-size:10px;color:#888">Odds: </span><strong>'+(americanOdds>0?'+':'')+americanOdds+'</strong> <span style="font-size:10px;color:#888">| Payout: </span><strong style="color:#66bb6a">$'+payout+'</strong></div><button class="ps-save-btn" id="ps-save">Save Parlay</button></div>';
picksEl.querySelectorAll('[data-rm-leg]').forEach(function(btn){
btn.addEventListener('click',function(){
parlayPicks.splice(parseInt(this.getAttribute('data-rm-leg')),1);
updateParlaySlip();
});
});
picksEl.querySelectorAll('[data-leg-idx]').forEach(function(inp){
inp.addEventListener('change',function(){
parlayPicks[parseInt(this.getAttribute('data-leg-idx'))].odds=this.value;
updateParlaySlip();
});
});
document.getElementById('ps-save').addEventListener('click',function(){
PM.addParlay(parlayPicks.slice(),Bank.d.unit,americanOdds,payout,'Standard');
parlayPicks=[];
updateParlaySlip();
playSound('win');
});
}

/* --- Pitcher Prop Predictions --- */
function renderPitcherProps(hSP,aSP,hTeam,aTeam,hD,aD){
if(!hSP&&!aSP)return'<div style="color:#888;font-size:10px;padding:4px">Pitcher prop data not available</div>';
function projK(sp,oppD){
if(!sp)return{val:5.0,conf:'Low'};
var k9=sp.k9||7.0;
var ip=sp.ip||80;
var avgIP=ip/(sp.gs||15);
var oppK=oppD&&oppD.hit?(1-(oppD.hit.avg||0.250))*1.2:1.0;
var predK=((k9/9)*avgIP)*oppK;
predK=Math.max(2,Math.min(14,predK));
var conf=sp.gs>=10?'High':(sp.gs>=5?'Med':'Low');
return{val:predK,conf:conf};
}
function projHits(sp,oppD){
if(!sp)return{val:6.0,conf:'Low'};
var whip=sp.whip||1.30;
var ip=sp.ip||80;
var avgIP=ip/(sp.gs||15);
var bb9=sp.bb9||3.0;
var hPer9=((whip*9)-bb9);
var predH=(hPer9/9)*avgIP;
var oppAvg=oppD&&oppD.hit?oppD.hit.avg||0.250:0.250;
predH=predH*(oppAvg/0.250);
predH=Math.max(2,Math.min(12,predH));
var conf=sp.gs>=10?'High':(sp.gs>=5?'Med':'Low');
return{val:predH,conf:conf};
}
function projER(sp,oppD){
if(!sp)return{val:3.0,conf:'Low'};
var era=sp.era||4.50;
var ip=sp.ip||80;
var avgIP=ip/(sp.gs||15);
var predER=(era/9)*avgIP;
var oppOps=oppD&&oppD.hit?oppD.hit.ops||0.720:0.720;
predER=predER*(oppOps/0.720);
predER=Math.max(0,Math.min(8,predER));
var conf=sp.gs>=10?'High':(sp.gs>=5?'Med':'Low');
return{val:predER,conf:conf};
}
var hK=projK(hSP,aD),aK=projK(aSP,hD);
var hH=projHits(hSP,aD),aH=projHits(aSP,hD);
var hER=projER(hSP,aD),aER=projER(aSP,hD);
function confClr(c){return c==='High'?'#66bb6a':(c==='Med'?'#ffd54f':'#ef5350');}
function propRow(label,hVal,hConf,aVal,aConf,lower){
var hBetter=lower?(hVal<=aVal):(hVal>=aVal);
var aBetter=!hBetter;
if(hVal===aVal){hBetter=false;aBetter=false;}
var hClr=hBetter?'#66bb6a':'#e0e0e0';
var aClr=aBetter?'#66bb6a':'#e0e0e0';
var r='<tr style="border-bottom:1px solid rgba(137,207,240,.04)">';
r+='<td style="padding:4px;text-align:center;font-weight:800;color:'+hClr+'">'+hVal.toFixed(1)+'</td>';
r+='<td style="text-align:center;font-size:8px;color:'+confClr(hConf)+'">'+hConf+'</td>';
r+='<td style="text-align:center;color:#89CFF0;font-weight:700;font-size:10px">'+label+'</td>';
r+='<td style="text-align:center;font-size:8px;color:'+confClr(aConf)+'">'+aConf+'</td>';
r+='<td style="padding:4px;text-align:center;font-weight:800;color:'+aClr+'">'+aVal.toFixed(1)+'</td>';
r+='</tr>';
return r;
}
var h='<div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(137,207,240,.08)">';
h+='<div style="text-align:center;font-size:10px;font-weight:800;color:#89CFF0;margin-bottom:6px">Pitcher Prop Predictions</div>';
h+='<table style="width:100%;font-size:9px;border-collapse:collapse;color:#e0e0e0">';
h+='<tr style="color:#89CFF0;font-weight:800;border-bottom:1px solid rgba(137,207,240,.1)">';
h+='<td style="text-align:center;padding:2px 4px">'+hTeam+'</td>';
h+='<td style="text-align:center;font-size:8px">Conf</td>';
h+='<td style="text-align:center">Prop</td>';
h+='<td style="text-align:center;font-size:8px">Conf</td>';
h+='<td style="text-align:center;padding:2px 4px">'+aTeam+'</td>';
h+='</tr>';
h+=propRow('PRED K',hK.val,hK.conf,aK.val,aK.conf,false);
h+=propRow('PRED HITS',hH.val,hH.conf,aH.val,aH.conf,true);
h+=propRow('PRED ER',hER.val,hER.conf,aER.val,aER.conf,true);
h+='</table>';
h+='<div style="text-align:center;font-size:8px;color:#888;margin-top:4px">Green = better projection | Conf based on games started</div>';
h+='</div>';
return h;
}

var NFLStandings={cache:null,ts:0};

async function fetchNFLStandings(){
if(NFLStandings.cache&&Date.now()-NFLStandings.ts<600000)return NFLStandings.cache;
try{
var teams={};
var weeks=[1,2,3,4,5];
var res=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week='+NFL_WEEK);
var data=await res.json();
if(data.events){
data.events.forEach(function(ev){
if(!ev.competitions||!ev.competitions[0])return;
ev.competitions[0].competitors.forEach(function(c){
var tm=c.team||{};
var abbr=tm.abbreviation||'';
if(teams[abbr])return;
var rec='0-0';
var home='0-0';
var away='0-0';
var confRec='0-0';
var divRec='0-0';
if(c.records){
c.records.forEach(function(r){

if(r.name==='Road'||r.type==='road')away=r.summary||away;

});
}
var rp=rec.split('-');
var w=parseInt(rp[0])||0;
var l=parseInt(rp[1])||0;
var t=parseInt(rp[2])||0;
teams[abbr]={
id:tm.id||'',
abbr:abbr,
name:tm.displayName||tm.name||'',
logo:tm.logo||'https://a.espncdn.com/i/teamlogos/nfl/500/'+abbr.toLowerCase()+'.png',
conf:'',
div:'',
w:w,l:l,t:t,
pct:((w+l+t)>0?(w/(w+l+t)).toFixed(3):'.000'),
pf:0,pa:0,diff:0,
streak:'-',
home:home,
away:away,
divRec:divRec,
confRec:confRec,
l5:'-'
};
});
});
}
NFLStandings.cache=teams;
NFLStandings.ts=Date.now();
return teams;
}catch(e){console.log('NFL standings error:',e);return{};}
}

var NFLRosterCache={};
var NFLInjuryCache={};

async function fetchNFLRoster(teamId){
if(NFLRosterCache[teamId])return NFLRosterCache[teamId];
try{
var res=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/'+teamId+'/roster');
var data=await res.json();
var roster={qb:[],rb:[],wr:[],te:[],ol:[],dl:[],lb:[],db:[],k:[],p:[]};
if(data.athletes){
data.athletes.forEach(function(group){
(group.items||[]).forEach(function(player){
var st={};
if(player.statistics){
var cats=player.statistics.splits?player.statistics.splits.categories:player.statistics.categories;
if(cats)(Array.isArray(cats)?cats:[cats]).forEach(function(cat){
var names=cat.names||[];
var vals=cat.stats||cat.values||[];
names.forEach(function(n,i){
var v=vals[i];
if(n==='passingYards')st.passYds=v;
if(n==='passingTouchdowns')st.passTD=v;
if(n==='interceptions'||n==='INT')st.intc=v;
if(n==='QBRating'||n==='passerRating')st.rating=typeof v==='number'?v.toFixed(1):v;
if(n==='rushingYards')st.rushYds=v;
if(n==='rushingTouchdowns')st.rushTD=v;
if(n==='yardsPerRushAttempt')st.ypc=typeof v==='number'?v.toFixed(1):v;
if(n==='fumbles'||n==='fumblesLost')st.fum=v;
if(n==='receptions')st.rec=v;
if(n==='receivingYards')st.recYds=v;
if(n==='receivingTouchdowns')st.recTD=v;
if(n==='receivingTargets')st.tgt=v;
if(n==='totalTackles'||n==='tackles')st.tkl=v;
if(n==='sacks')st.sck=typeof v==='number'?v.toFixed(1):v;
if(n==='tacklesForLoss')st.tfl=v;
if(n==='passesDefended')st.pd=v;
if(n==='forcedFumbles')st.ff=v;
if(n==='fieldGoalPct')st.fgPct=typeof v==='number'?v.toFixed(1)+'%':v;
if(n==='extraPointPct')st.xpPct=typeof v==='number'?v.toFixed(1)+'%':v;
if(n==='totalKickingPoints'||n==='totalPoints')st.pts=v;
if(n==='grossAvgPuntYards'||n==='avgPuntYards')st.avg=typeof v==='number'?v.toFixed(1):v;
if(n==='puntsInside20')st.in20=v;
});
});
}
var p={
id:player.id||'',
name:player.displayName||player.fullName||'',
num:player.jersey||'',
pos:player.position?player.position.abbreviation:'',
age:player.age||'',
exp:player.experience?player.experience.years:0,
college:player.college?player.college.name:'',
ht:player.displayHeight||'',
wt:player.displayWeight||'',
status:player.status?player.status.type:'active',
headshot:player.headshot?player.headshot.href:'',
stats:st
};
if(p.pos==='QB')roster.qb.push(p);
else if(p.pos==='RB'||p.pos==='FB')roster.rb.push(p);
else if(p.pos==='WR')roster.wr.push(p);
else if(p.pos==='TE')roster.te.push(p);
else if(['OT','OG','C','T','G'].indexOf(p.pos)>=0)roster.ol.push(p);
else if(['DE','DT','NT'].indexOf(p.pos)>=0)roster.dl.push(p);
else if(['LB','OLB','ILB','MLB'].indexOf(p.pos)>=0)roster.lb.push(p);
else if(['CB','S','FS','SS','DB'].indexOf(p.pos)>=0)roster.db.push(p);
else if(p.pos==='K'||p.pos==='PK')roster.k.push(p);
else if(p.pos==='P')roster.p.push(p);
});
});
}
NFLRosterCache[teamId]=roster;
return roster;
}catch(e){console.log('Roster error team '+teamId+':',e);return{qb:[],rb:[],wr:[],te:[],ol:[],dl:[],lb:[],db:[],k:[],p:[]};}
}

/* --- NFL O/U Prediction (model + Vegas) --- */
function nflOU(pred,hD,aD,vegasData){
var hOff=hD.ppg||22;var aOff=aD.ppg||22;
var hDef=hD.oppPpg||22;var aDef=aD.oppPpg||22;
var hExpected=(hOff*0.6+aDef*0.4);
var aExpected=(aOff*0.6+hDef*0.4);
var modelTotal=hExpected+aExpected;
var vegasTotal=(vegasData&&vegasData.total)?vegasData.total:null;
var line=vegasTotal||Math.round(modelTotal*2)/2;
var pick=modelTotal>line?'Over':'Under';
return{pick:pick,modelTotal:parseFloat(modelTotal.toFixed(1)),line:line,vegasTotal:vegasTotal,hExp:parseFloat(hExpected.toFixed(1)),aExp:parseFloat(aExpected.toFixed(1))};
}

/* --- NFL Spread Prediction (model + Vegas) --- */
function nflSpread(pred,hD,aD,vegasData){
var margin=pred.hp-pred.ap;
var vegasSpread=(vegasData&&vegasData.spread)?vegasData.spread:null;
var modelSpread,favTeam,pick;
if(margin>0.08){
modelSpread=-1.5;favTeam='home';pick='-1.5 HOME';
}else if(margin<-0.08){
modelSpread=1.5;favTeam='away';pick='+1.5 AWAY';
}else{
modelSpread=0;favTeam='toss';pick='EVEN';
}
return{modelSpread:modelSpread,vegasSpread:vegasSpread,favTeam:favTeam,pick:pick};
}

/* ===== NFL UPGRADE PATCH: Division Rivalry, Primetime Badges, Injury Impact, Red Zone Efficiency ===== */

/* --- 1. Division Rivalry Map --- */
var NFL_DIVISIONS={
'AFC East':['BUF','MIA','NE','NYJ'],
'AFC North':['BAL','CIN','CLE','PIT'],
'AFC South':['HOU','IND','JAX','TEN'],
'AFC West':['DEN','KC','LAC','LV'],
'NFC East':['DAL','NYG','PHI','WAS'],
'NFC North':['CHI','DET','GB','MIN'],
'NFC South':['ATL','CAR','NO','TB'],
'NFC West':['ARI','LAR','SEA','SF']
};

function isDivisionRivalry(hAbbr,aAbbr){
for(var div in NFL_DIVISIONS){
var teams=NFL_DIVISIONS[div];
if(teams.indexOf(hAbbr)!==-1&&teams.indexOf(aAbbr)!==-1)return div;
}
return null;
}

function getDivisionBadge(hAbbr,aAbbr){
var div=isDivisionRivalry(hAbbr,aAbbr);
if(!div)return '';
return '<span style="display:inline-block;background:rgba(255,152,0,.15);color:#ffa726;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid rgba(255,152,0,.3)">DIV RIVALRY</span>';
}

/* --- 2. Primetime Game Detection + Badges --- */
function getPrimetimeBadge(gameDate,broadcast){
if(!gameDate)return '';
var d=new Date(gameDate);
var day=d.getDay();
var hour=d.getHours();
var bc=(broadcast||'').toUpperCase();

if(day===4||(day===5&&hour<3))
return '<span style="display:inline-block;background:rgba(0,200,83,.12);color:#00c853;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid rgba(0,200,83,.3)">TNF</span>';
if(day===0&&hour>=20||(day===1&&hour<3))
return '<span style="display:inline-block;background:rgba(255,215,0,.15);color:#ffd700;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid rgba(255,215,0,.3)">SNF</span>';
if(day===1&&hour>=19||(day===2&&hour<3))
return '<span style="display:inline-block;background:rgba(33,150,243,.15);color:#42a5f5;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid rgba(33,150,243,.3)">MNF</span>';
if(bc.indexOf('ESPN')!==-1||bc.indexOf('ABC')!==-1)
return '<span style="display:inline-block;background:rgba(33,150,243,.12);color:#42a5f5;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid rgba(33,150,243,.3)">MNF</span>';
if(bc.indexOf('PRIME')!==-1||bc.indexOf('AMAZON')!==-1)
return '<span style="display:inline-block;background:rgba(0,200,83,.12);color:#00c853;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid rgba(0,200,83,.3)">TNF</span>';
if(bc.indexOf('NBC')!==-1&&(day===0&&hour>=20))
return '<span style="display:inline-block;background:rgba(255,215,0,.15);color:#ffd700;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid rgba(255,215,0,.3)">SNF</span>';
return '';
}

/* --- 3. NFL Injury Impact Rating --- */
var NFL_POS_WEIGHT={
'QB':10,'RB':6,'WR':7,'TE':5,'LT':7,'LG':5,'C':5,'RG':5,'RT':7,
'OL':6,'OT':7,'OG':5,
'DE':7,'DT':6,'NT':5,'DL':6,'EDGE':7,
'LB':6,'ILB':6,'OLB':6,'MLB':6,
'CB':7,'S':6,'FS':6,'SS':6,'DB':6,
'K':4,'P':2,'LS':1,'KR':2,'PR':2
};

function calcInjuryImpact(injuries){
if(!injuries||injuries.length===0)return{score:0,rating:'Healthy',color:'#66bb6a',keyOut:[]};
var total=0;
var keyOut=[];
injuries.forEach(function(inj){
var pos=(inj.position||'').toUpperCase();
var weight=NFL_POS_WEIGHT[pos]||3;
var statusMult=1;
var st=(inj.status||'').toLowerCase();
if(st.indexOf('out')!==-1||st.indexOf('ir')!==-1)statusMult=1.0;
else if(st.indexOf('doubtful')!==-1)statusMult=0.85;
else if(st.indexOf('questionable')!==-1)statusMult=0.5;
else if(st.indexOf('probable')!==-1)statusMult=0.2;
var impact=weight*statusMult;
total+=impact;
if(weight>=6&&statusMult>=0.5)keyOut.push({name:inj.name||'Unknown',pos:pos,status:inj.status||'Out',impact:impact.toFixed(1)});
});
var rating,color;
if(total>=20){rating='CRITICAL';color='#ef5350';}
else if(total>=12){rating='HIGH';color='#ffa726';}
else if(total>=6){rating='MODERATE';color='#ffd54f';}
else if(total>0){rating='LOW';color='#81c784';}
else{rating='Healthy';color='#66bb6a';}
return{score:parseFloat(total.toFixed(1)),rating:rating,color:color,keyOut:keyOut};
}

function getInjuryImpactBadge(injuries){
var imp=calcInjuryImpact(injuries);
if(imp.rating==='Healthy')return '';
return '<span style="display:inline-block;background:rgba('+
(imp.rating==='CRITICAL'?'239,83,80':imp.rating==='HIGH'?'255,167,38':imp.rating==='MODERATE'?'255,213,79':'129,199,132')+
',.12);color:'+imp.color+';font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid '+imp.color+'">INJ: '+imp.rating+'</span>';
}

function renderInjuryImpactPanel(hInj,aInj,hAbbr,aAbbr){
var hImp=calcInjuryImpact(hInj);
var aImp=calcInjuryImpact(aInj);
var h='<div style="padding:8px">';
h+='<div style="display:flex;gap:12px;margin-bottom:8px">';
h+='<div style="flex:1;text-align:center;padding:8px;border-radius:6px;background:rgba(137,207,240,.05);border:1px solid rgba(137,207,240,.1)">';
h+='<div style="font-size:10px;color:#888">'+hAbbr+' Impact</div>';
h+='<div style="font-size:20px;font-weight:900;color:'+hImp.color+'">'+hImp.score+'</div>';
h+='<div style="font-size:10px;font-weight:800;color:'+hImp.color+'">'+hImp.rating+'</div>';
h+='</div>';
h+='<div style="flex:1;text-align:center;padding:8px;border-radius:6px;background:rgba(137,207,240,.05);border:1px solid rgba(137,207,240,.1)">';
h+='<div style="font-size:10px;color:#888">'+aAbbr+' Impact</div>';
h+='<div style="font-size:20px;font-weight:900;color:'+aImp.color+'">'+aImp.score+'</div>';
h+='<div style="font-size:10px;font-weight:800;color:'+aImp.color+'">'+aImp.rating+'</div>';
h+='</div></div>';

function renderKeyList(imp,abbr){
if(imp.keyOut.length===0)return '<div style="font-size:10px;color:#66bb6a;text-align:center">No key players out</div>';
var s='';
imp.keyOut.forEach(function(p){
s+='<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:10px;border-bottom:1px solid rgba(137,207,240,.06)">';
s+='<span style="color:#ccc">'+p.name+' ('+p.pos+')</span>';
s+='<span style="color:'+imp.color+';font-weight:800">'+p.status+' | '+p.impact+'pts</span>';
s+='</div>';
});
return s;
}

h+='<div style="margin-bottom:6px"><div style="font-size:10px;font-weight:800;color:#89CFF0;margin-bottom:4px">'+hAbbr+' Key Players Out</div>';
h+=renderKeyList(hImp,hAbbr)+'</div>';
h+='<div><div style="font-size:10px;font-weight:800;color:#89CFF0;margin-bottom:4px">'+aAbbr+' Key Players Out</div>';
h+=renderKeyList(aImp,aAbbr)+'</div>';
h+='</div>';
return h;
}

/* --- 4. Red Zone Efficiency (Offense + Defense) --- */
async function fetchRedZoneStats(){
if(window._nflRZCache)return window._nflRZCache;
try{
var res=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams?limit=32');
var data=await res.json();
var rz={};
if(data.sports&&data.sports[0]&&data.sports[0].leagues&&data.sports[0].leagues[0]){
var teams=data.sports[0].leagues[0].teams;
teams.forEach(function(t){
var team=t.team;
var abbr=(team.abbreviation||'').toUpperCase();
var offRZ=55,defRZ=55;
if(team.record&&team.record.items){
team.record.items.forEach(function(r){
if(r.stats){
r.stats.forEach(function(s){
if(s.name==='pointsFor'){
offRZ=50+((parseFloat(s.value)||350)-350)/50*5;
}
if(s.name==='pointsAgainst'){
defRZ=50+((350-parseFloat(s.value)||350))/50*5;
}
});
}
});
}
offRZ=Math.max(30,Math.min(75,offRZ));
defRZ=Math.max(30,Math.min(75,defRZ));
rz[abbr]={offRZ:parseFloat(offRZ.toFixed(1)),defRZ:parseFloat(defRZ.toFixed(1))};
});
}
window._nflRZCache=rz;
return rz;
}catch(e){return{};}
}

function getRedZoneBadge(hAbbr,aAbbr,rzData){
if(!rzData||!rzData[hAbbr]||!rzData[aAbbr])return '';
var hOff=rzData[hAbbr].offRZ;
var hDef=rzData[hAbbr].defRZ;
var aOff=rzData[aAbbr].offRZ;
var aDef=rzData[aAbbr].defRZ;
var hRZscore=(hOff+hDef)/2;
var aRZscore=(aOff+aDef)/2;
var diff=Math.abs(hRZscore-aRZscore);
if(diff<5)return '';
var better=hRZscore>aRZscore?hAbbr:aAbbr;
var clr=diff>10?'#66bb6a':'#ffd54f';
return '<span style="display:inline-block;background:rgba('+(diff>10?'102,187,106':'255,213,79')+',.12);color:'+clr+';font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid '+clr+'">RZ EDGE: '+better+'</span>';
}

function getRedZoneTooltip(hAbbr,aAbbr,rzData){
if(!rzData||!rzData[hAbbr]||!rzData[aAbbr])return '';
var h=rzData[hAbbr],a=rzData[aAbbr];
return '<div style="display:flex;gap:8px;margin:4px 0">'
+'<div style="flex:1;text-align:center;padding:4px;border-radius:4px;background:rgba(137,207,240,.05);border:1px solid rgba(137,207,240,.08)">'
+'<div style="font-size:9px;color:#888">'+hAbbr+' RZ</div>'
+'<div style="font-size:10px;color:#66bb6a;font-weight:800">Off: '+h.offRZ+'%</div>'
+'<div style="font-size:10px;color:#ef5350;font-weight:800">Def: '+h.defRZ+'%</div>'
+'</div>'
+'<div style="flex:1;text-align:center;padding:4px;border-radius:4px;background:rgba(137,207,240,.05);border:1px solid rgba(137,207,240,.08)">'
+'<div style="font-size:9px;color:#888">'+aAbbr+' RZ</div>'
+'<div style="font-size:10px;color:#66bb6a;font-weight:800">Off: '+a.offRZ+'%</div>'
+'<div style="font-size:10px;color:#ef5350;font-weight:800">Def: '+a.defRZ+'%</div>'
+'</div></div>';
}

(function injectNFLUpgrades(){

};
